name: Staging & Infrastructure Health Check

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  staging-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Staging Appwrite Ping
        env:
          STAGING_APPWRITE_ENDPOINT: ${{ secrets.STAGING_APPWRITE_ENDPOINT }}
          STAGING_APPWRITE_PROJECT_ID: ${{ secrets.STAGING_APPWRITE_PROJECT_ID }}
        run: |
          if [ -z "$STAGING_APPWRITE_ENDPOINT" ] || [ -z "$STAGING_APPWRITE_PROJECT_ID" ]; then
            echo "❌ Staging environment secrets STAGING_APPWRITE_ENDPOINT or STAGING_APPWRITE_PROJECT_ID are missing."
            exit 1
          fi
          flutter test test/integration/appwrite_staging_smoke_test.dart \
            --dart-define=STAGING_APPWRITE_ENDPOINT="$STAGING_APPWRITE_ENDPOINT" \
            --dart-define=STAGING_APPWRITE_PROJECT_ID="$STAGING_APPWRITE_PROJECT_ID"

      - name: Appwrite Schema Drift Detection
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "⚠️ APPWRITE_API_KEY missing; skipping schema drift check."
            exit 0
          fi
          node scripts/snapshot_appwrite_schema.mjs
          git diff --exit-code test/fixtures/schema/
