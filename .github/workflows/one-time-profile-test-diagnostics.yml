name: One-time profile test diagnostics

on:
  push:
    branches:
      - fix/profile-avatar-production-quality
    paths:
      - .github/workflows/one-time-profile-test-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Run full tests and coverage gate
        shell: bash
        run: |
          set +e
          flutter pub get > ci-profile-test-diagnostics.txt 2>&1
          flutter test --coverage --concurrency=4 > /tmp/full-flutter-tests.log 2>&1
          test_status=$?
          echo "FULL_TEST_EXIT=$test_status" >> ci-profile-test-diagnostics.txt
          if [ "$test_status" -ne 0 ]; then
            echo "===== FAILURE MATCHES =====" >> ci-profile-test-diagnostics.txt
            grep -n -B 15 -A 60 -E '\[E\]|Some tests failed|Failing tests:|Expected:|Actual:|Exception|Error:' /tmp/full-flutter-tests.log >> ci-profile-test-diagnostics.txt || true
            echo "===== TEST LOG TAIL =====" >> ci-profile-test-diagnostics.txt
            tail -n 500 /tmp/full-flutter-tests.log >> ci-profile-test-diagnostics.txt
          else
            tail -n 40 /tmp/full-flutter-tests.log >> ci-profile-test-diagnostics.txt
          fi
          coverage_status=99
          if [ "$test_status" -eq 0 ]; then
            dart run tool/enforce_coverage.dart \
              --min=70 \
              --path-min=/data/:40 \
              --path-min=/domain/:70 \
              --path-min=/core/auth/:50 \
              --enforce-after=2026-06-21 \
              --enforce-untested-after=2026-10-01 \
              --allow-invisible=_web.dart \
              --allow-invisible=_html.dart \
              --allow-invisible=/domain/repositories/ \
              --allow-invisible=lib/app/router/route_names.dart \
              --allow-invisible=lib/app/router/url_strategy.dart \
              --allow-invisible=lib/core/auth/web_redirect.dart \
              --allow-invisible=lib/core/motion/motion.dart \
              --allow-invisible=lib/shared/models/content_models.dart \
              --allow-invisible=lib/shared/models/content_item.dart \
              --allow-invisible=lib/shared/models/content/category_model.dart \
              --allow-invisible=lib/shared/providers/providers.dart \
              --allow-invisible=lib/shared/widgets/animated_buttons.dart \
              --allow-invisible=lib/shared/widgets/buttons/animated_buttons.dart \
              --allow-invisible=lib/shared/widgets/buttons/button_tokens.dart \
              --allow-invisible=lib/features/affirmations/domain/affirmation_share_service.dart \
              --allow-invisible=lib/features/practice/domain/practice_scoring_rules.dart \
              --allow-invisible=lib/features/admin/presentation/admin_login_screen.dart \
              --allow-invisible=lib/features/admin/presentation/admin_media_screen.dart \
              --allow-invisible=lib/features/admin/presentation/admin_settings_screen.dart \
              --allow-invisible=lib/features/admin/presentation/analytics/admin_analytics_csv_exporter.dart \
              --allow-invisible=lib/features/admin/presentation/quizzes/widgets/quiz_form_sheet.dart \
              --allow-invisible=lib/features/admin/presentation/widgets/admin_form_widgets.dart \
              --allow-invisible=lib/features/auth/presentation/email_auth_screen.dart \
              --allow-invisible=lib/features/categories/presentation/providers/category_providers.dart \
              --allow-invisible=lib/features/lessons/presentation/providers/lesson_providers.dart \
              --allow-invisible=lib/features/lessons/presentation/quiz/quiz_screen.dart \
              --allow-invisible=lib/features/lessons/presentation/widgets/lesson_content_widgets.dart \
              --allow-invisible=lib/features/main/presentation/main_shell_screen.dart \
              --allow-invisible=lib/features/profile/presentation/providers/profile_providers.dart \
              >> ci-profile-test-diagnostics.txt 2>&1
            coverage_status=$?
          fi
          echo "COVERAGE_GATE_EXIT=$coverage_status" >> ci-profile-test-diagnostics.txt
          cat ci-profile-test-diagnostics.txt
          exit 0
      - name: Commit diagnostic report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-profile-test-diagnostics.txt
          git commit -m 'ci: record full avatar coverage diagnostics'
          git push
