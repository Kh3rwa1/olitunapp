name: One-time main status diagnostics

on:
  push:
    branches:
      - fix/sync-appwrite-runtime-config-20260910
    paths:
      - .github/workflows/one-time-main-status-diagnostics.yml

permissions:
  actions: read
  checks: read
  statuses: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Inspect main status rollup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          SHA="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$SHA/check-runs?filter=all&per_page=100" > /tmp/checks.json
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$SHA/status?per_page=100" > /tmp/status.json
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/workflows/flutter-ci.yml/runs?branch=main&per_page=20" > /tmp/flutter-runs.json
          {
            echo '# Main status diagnostics'
            echo
            echo "Head: $SHA"
            echo
            echo '## Check runs'
            jq -r '.check_runs | sort_by(.name)[] | "- \(.name): status=\(.status), conclusion=\(.conclusion // "pending"), \(.html_url // .details_url // "")"' /tmp/checks.json
            echo
            echo '## Legacy commit status rollup'
            jq -r '"Combined state: \(.state)", (.statuses[] | "- \(.context): state=\(.state), description=\(.description // ""), \(.target_url // "")")' /tmp/status.json
            echo
            echo '## Latest Flutter CI runs on main'
            jq -r '.workflow_runs[] | "- run=\(.id), event=\(.event), status=\(.status), conclusion=\(.conclusion // "pending"), sha=\(.head_sha), created=\(.created_at), \(.html_url)"' /tmp/flutter-runs.json
          } > ci-main-status-diagnostics.md

      - name: Commit status report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-main-status-diagnostics.md
          git commit -m 'ci: record main commit status rollup'
          git push origin HEAD:${GITHUB_REF_NAME}
