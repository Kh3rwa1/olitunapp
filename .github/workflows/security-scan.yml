name: Security Scanning

on:
  push:
    branches: [main, 'hardening/*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC

permissions:
  contents: read

jobs:
  action-pinning-audit:
    name: GitHub Action Pinning Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify All GitHub Actions are Pinned to Commit SHAs
        run: node scripts/verify_pinned_actions.mjs

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run OSV Scanner for Dart
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --format=table

      - name: Discover every npm lockfile
        id: npm-lockfiles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lockfiles < <(find . -type f -name package-lock.json -not -path '*/node_modules/*' | sort)
          if [ "${#lockfiles[@]}" -eq 0 ]; then
            echo "No npm lockfiles found."
            exit 1
          fi
          {
            echo 'args<<EOF'
            for lockfile in "${lockfiles[@]}"; do
              echo "--lockfile=${lockfile#./}"
            done
            echo '--format=table'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          printf 'Scanning %s npm lockfiles:\n' "${#lockfiles[@]}"
          printf '  %s\n' "${lockfiles[@]}"

      - name: Scan every npm dependency graph
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.3.8
        with:
          scan-args: ${{ steps.npm-lockfiles.outputs.args }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v4.3.1
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v4.3.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v4.3.1

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [action-pinning-audit, gitleaks, osv-scanner, codeql]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check All Security Scans Succeeded
        run: |
          if [ "${{ needs.action-pinning-audit.result }}" != "success" ] || \
             [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.osv-scanner.result }}" != "success" ] || \
             [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "❌ Security Gate: One or more required security scans failed, were skipped, or were cancelled."
            exit 1
          fi
          echo "✅ Security Gate: All security scans and action pinning passed successfully!"
