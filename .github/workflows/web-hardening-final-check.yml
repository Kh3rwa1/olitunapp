name: One-time web hardening final check

on:
  push:
    branches: ['fix/web-media-accessibility-20260905']
    paths: ['.github/workflows/web-hardening-final-check.yml']

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'Kh3rwa1/olitunapp' && github.ref == 'refs/heads/fix/web-media-accessibility-20260905' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed corrections and preserve concurrent updates
        run: |
          git show 29fc48f8c35c660300fbc0429b671403ff5c2bb0:scripts/prepare_hardening_validation.py > "$RUNNER_TEMP/recheck_web.py"
          AREA=web python3 "$RUNNER_TEMP/recheck_web.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/home/presentation/widgets/home_content_grid.dart test/features/home/widgets/home_category_accessibility_test.dart
          git commit -m 'fix(web): correct semantics cleanup and current analyzer APIs'
          git pull --rebase origin fix/web-media-accessibility-20260905
          git push origin HEAD:refs/heads/fix/web-media-accessibility-20260905
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Record corrected source validation
        run: |
          REPORT=docs/WEB_HARDENING_DIAGNOSTICS.txt
          printf 'Source before final formatting: %s\n' "$(git rev-parse HEAD)" > "$REPORT"
          flutter --version >> "$REPORT"
          dart format lib/features/home/presentation/widgets/home_content_grid.dart test/features/home/widgets/home_category_accessibility_test.dart >> "$REPORT" 2>&1
          set +e
          timeout 7m flutter test test/features/home/widgets/home_category_accessibility_test.dart test/features/home/home_screen_test.dart --reporter expanded >> "$REPORT" 2>&1
          TEST_EXIT=$?
          timeout 5m flutter analyze --fatal-infos >> "$REPORT" 2>&1
          ANALYZE_EXIT=$?
          node --test functions/test/web_media_policy.test.js >> "$REPORT" 2>&1
          NODE_EXIT=$?
          printf '\nFocused test exit: %s\nAnalysis exit: %s\nNode test exit: %s\n' "$TEST_EXIT" "$ANALYZE_EXIT" "$NODE_EXIT" >> "$REPORT"
          printf 'TEST_EXIT=%s\nANALYZE_EXIT=%s\nNODE_EXIT=%s\n' "$TEST_EXIT" "$ANALYZE_EXIT" "$NODE_EXIT" >> "$GITHUB_ENV"
      - name: Save evidence and remove one-time tooling
        run: |
          git rm -f --ignore-unmatch .github/workflows/web-hardening-final-check.yml .github/workflows/hardening-validation.yml scripts/prepare_hardening_validation.py
          git add lib/features/home/presentation/widgets/home_content_grid.dart test/features/home/widgets/home_category_accessibility_test.dart docs/WEB_HARDENING_DIAGNOSTICS.txt
          git commit -m 'test(web): record corrected accessibility checks and remove tooling'
          git pull --rebase origin fix/web-media-accessibility-20260905
          git push origin HEAD:refs/heads/fix/web-media-accessibility-20260905
      - name: Require passing checks
        run: test "$TEST_EXIT" = 0 && test "$ANALYZE_EXIT" = 0 && test "$NODE_EXIT" = 0
