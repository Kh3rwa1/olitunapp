name: Auto Format (temporary)

on:
  push:
    branches: [ feat/multilingual-foundation ]

permissions:
  contents: write

concurrency:
  group: autoformat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-format:
    name: Apply dart format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply dart format
        run: dart format .
      - name: Commit and push if changed
        run: |
          git config user.name "ci-autoformat"
          git config user.email "ci-autoformat@localhost"
          if git diff --quiet; then
            echo "Already formatted; nothing to do."
            exit 0
          fi
          git add -A
          git commit -m "style: apply dart format"
          git push
