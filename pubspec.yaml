name: itun
description: Olitun - Premium Ol Chiki (Santali Script) Learning App
publish_to: 'none'
version: 1.3.0+25

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.2.3

  # Local Storage
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  flutter_animate: ^4.5.2
  flutter_web_auth_2: ^5.0.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  fl_chart: ^1.2.0

  # Audio & Video
  lottie: ^3.3.1
  video_player: ^2.8.6



  # Auth
  # Constrained to 21.x to match backend server API (TablesDB) and prevent breaking 22+ SDK changes
  appwrite: ^21.1.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  file_picker: ^10.3.10
  http: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.8

  path_provider: ^2.1.5
  web: ^1.1.1
  fpdart: ^1.1.0
  connectivity_plus: ^7.3.1
  equatable: ^2.1.0
  flutter_markdown_plus: ^1.0.12

  # Crash & error reporting
  sentry_flutter: ^9.28.0
  share_plus: ^12.0.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  razorpay_flutter: ^1.3.7
  crypto: ^3.0.6
  in_app_review: ^2.0.9
  url_launcher: ^6.3.2

  # Ads & Monetization
  google_mobile_ads: ^7.0.0

  # Notifications & Habit Retention
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

  flutter_web_plugins:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  just_audio_platform_interface: ^4.6.0
  video_player_platform_interface: ^6.7.0
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/seed/



  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: OlChiki
      fonts:
        - asset: assets/fonts/OlChiki.ttf
