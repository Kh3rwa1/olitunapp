<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070B13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Olitun — Offline</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fbfffd 0%, #eef8f3 46%, #d9fae9 100%);
      color: #111827;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(180deg, #0A0E14 0%, #111827 100%); color: #F9FAFB; }
      .card { background: rgba(31,41,55,.9) !important; border-color: rgba(55,65,81,.8) !important; }
      .sub { color: #9CA3AF !important; }
    }
    .card {
      width: min(100%, 480px);
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(15,23,42,.08);
    }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 16px;
      border-radius: 20px; background: #39e58a;
      display: grid; place-items: center; overflow: hidden;
      font-size: 36px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 900; letter-spacing: -.5px; }
    .sub { margin: 0 0 20px; color: #4B5563; font-size: 14px; line-height: 1.5; font-weight: 600; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      min-height: 48px; padding: 12px 22px; border-radius: 14px; border: none;
      font-weight: 800; font-size: 15px; cursor: pointer;
    }
    .primary { background: #10B981; color: #fff; }
    .ghost { background: transparent; border: 1px solid currentColor; opacity: .8; }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">🌿</div>
    <h1>You're offline</h1>
    <p class="sub">Olitun needs a connection for this screen. Cached lessons and quizzes open automatically when available — check your connection and try again.</p>
    <div class="row">
      <button class="primary" type="button" onclick="window.location.reload()">Try again</button>
      <button class="ghost" type="button" onclick="window.location.href='/'">Go home</button>
    </div>
  </main>
</body>
</html>
