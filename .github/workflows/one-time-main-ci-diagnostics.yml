name: One-time main CI diagnostics

on:
  push:
    branches:
      - fix/sync-appwrite-runtime-config-20260910
    paths:
      - .github/workflows/one-time-main-ci-diagnostics.yml

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Collect latest main workflow results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          HEAD_SHA="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          gh api "repos/$REPO/actions/runs?branch=main&per_page=50" > /tmp/main-runs.json

          {
            echo "# Main CI diagnostics"
            echo
            echo "Head: $HEAD_SHA"
            echo
            echo "## Workflow runs for the current main commit"
            jq -r --arg sha "$HEAD_SHA" '
              .workflow_runs[]
              | select(.head_sha == $sha)
              | "- \(.name) | event=\(.event) | status=\(.status) | conclusion=\(.conclusion // "pending") | run=\(.id) | \(.html_url)"
            ' /tmp/main-runs.json

            echo
            echo "## Non-successful jobs and steps"
            while read -r run_id; do
              [ -z "$run_id" ] && continue
              gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" > "/tmp/jobs-$run_id.json"
              jq -r --arg run "$run_id" '
                .jobs[]
                | select((.conclusion // "pending") != "success")
                | "### Run \($run): \(.name) — \(.conclusion // .status)\n"
                  + ([.steps[] | select((.conclusion // "pending") != "success") | "- step: \(.name) — \(.conclusion // .status)"] | join("\n"))
              ' "/tmp/jobs-$run_id.json"
            done < <(
              jq -r --arg sha "$HEAD_SHA" '
                .workflow_runs[]
                | select(.head_sha == $sha and ((.conclusion // "pending") != "success"))
                | .id
              ' /tmp/main-runs.json
            )
          } > ci-diagnostics-main.md

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-diagnostics-main.md
          git commit -m 'ci: record main branch failure diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}
