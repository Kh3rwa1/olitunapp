name: Secure Lesson Boundary Audit (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/secure-listing-autofix.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Audit lesson and entitlement boundaries
        run: python3 scripts/audit_lesson_boundary.py
      - name: Commit audit report
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-lesson-boundary-audit.txt
          git commit -m 'chore(security): capture lesson boundary audit'
          git push origin "HEAD:$BRANCH"
