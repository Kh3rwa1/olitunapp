name: Fix Inactive Listing Harness (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/fix-inactive-listing-harness.yml']

concurrency:
  group: fix-inactive-listing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/translator/package-lock.json
      - name: Correct test harness
        run: python3 scripts/fix_inactive_listing_harness.py
      - name: Install backend dependencies
        run: |
          npm ci
          npm ci --prefix functions/translator
      - name: Verify complete backend suite
        run: |
          set +e
          npm run test:backend > /tmp/fix-inactive-listing.log 2>&1
          echo $? > /tmp/fix-inactive-listing.status
          exit 0
      - name: Commit verified correction and clean temporary files
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(cat /tmp/fix-inactive-listing.status)
          if [ "$status" -eq 0 ]; then
            rm -f .ci-inactive-boundary-diagnostics.txt
          else
            cp /tmp/fix-inactive-listing.log .ci-inactive-boundary-diagnostics.txt
          fi
          rm -f \
            .github/workflows/fix-inactive-listing-harness.yml \
            scripts/fix_inactive_listing_harness.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(security): verify inactive lesson filtering'
          git push origin "HEAD:$BRANCH"
          exit "$status"
