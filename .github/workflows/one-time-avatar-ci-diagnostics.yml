name: One-time animated avatar diagnostics

on:
  push:
    branches:
      - fix/main-ci-after-leaderboard-animation
    paths:
      - .github/workflows/one-time-avatar-ci-diagnostics.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Collect corrected avatar PR failure
        shell: bash
        run: |
          set +e
          {
            echo "COLLECTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "===== RUN DETAILS ====="
            gh run view 34551683703 --repo "$GITHUB_REPOSITORY" \
              --json databaseId,name,event,status,conclusion,url,jobs
            echo "===== FAILED LOGS ====="
            gh run view 34551683703 --repo "$GITHUB_REPOSITORY" --log-failed
          } > ci-avatar-diagnostics.txt 2>&1
          cat ci-avatar-diagnostics.txt
          exit 0
      - name: Commit avatar diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-avatar-diagnostics.txt
          git commit -m 'ci: update animated avatar failure report'
          git push
