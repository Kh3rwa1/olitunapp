name: Secure Lesson Listing Autofix (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/secure-listing-autofix.yml']

permissions:
  contents: write

jobs:
  patch-format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Apply deterministic secure-listing patch
        run: python3 scripts/patch_secure_listing.py
      - name: Install dependencies
        run: flutter pub get
      - name: Format and capture focused verification
        run: |
          set +e
          dart format \
            lib/features/lessons/data/datasources/lesson_remote_datasource.dart \
            test/features/lessons/lesson_remote_datasource_list_authorized_test.dart \
            > /tmp/secure-listing-diagnostics.log 2>&1
          format_status=$?
          node --check functions/getAuthorizedLesson/src/main.js >> /tmp/secure-listing-diagnostics.log 2>&1
          node_status=$?
          npm run test:backend >> /tmp/secure-listing-diagnostics.log 2>&1
          backend_status=$?
          flutter analyze --fatal-infos >> /tmp/secure-listing-diagnostics.log 2>&1
          analyze_status=$?
          flutter test \
            test/features/lessons/lesson_remote_datasource_authorized_test.dart \
            test/features/lessons/lesson_remote_datasource_list_authorized_test.dart \
            >> /tmp/secure-listing-diagnostics.log 2>&1
          test_status=$?
          if [ "$format_status" -eq 0 ] && [ "$node_status" -eq 0 ] && \
             [ "$backend_status" -eq 0 ] && [ "$analyze_status" -eq 0 ] && \
             [ "$test_status" -eq 0 ]; then
            echo 0 > /tmp/secure-listing-diagnostics.status
          else
            echo 1 > /tmp/secure-listing-diagnostics.status
          fi
          exit 0
      - name: Commit implementation and diagnostics
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(cat /tmp/secure-listing-diagnostics.status)
          if [ "$status" -ne 0 ]; then
            cp /tmp/secure-listing-diagnostics.log .ci-secure-listing-diagnostics.txt
          else
            rm -f .ci-secure-listing-diagnostics.txt
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            functions/getAuthorizedLesson/src/main.js \
            lib/features/lessons/data/datasources/lesson_remote_datasource.dart \
            test/features/lessons/lesson_remote_datasource_list_authorized_test.dart
          git add -A .ci-secure-listing-diagnostics.txt
          git commit -m 'feat(security): route lesson lists through authorization function'
          git push origin "HEAD:$BRANCH"
          exit "$status"
