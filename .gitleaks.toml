# .gitleaks.toml
# Gitleaks configuration for Olitun
# https://github.com/gitleaks/gitleaks

[extend]
# Use the default gitleaks config as a base
useDefault = true

[[rules]]
id = "appwrite-session-secret"
description = "Appwrite Session Secret or Cookie"
regex = '''(?i)(appwrite[_-]?session[_-]?secret\s*[:=]\s*['"]?[a-zA-Z0-9_\-\.]{16,}['"]?|a_session_[a-z0-9_-]+\s*[:=]\s*['"]?[a-zA-Z0-9_\-\.]{16,}['"]?|a_session_[a-z0-9_-]+\t+[a-zA-Z0-9_\-\.]{16,})'''
keywords = ["appwrite_session_secret", "a_session_"]

[allowlist]
description = "Known non-secret token prefixes and build output paths"
paths = [
  '''^\.dart_tool/''',
  '''^build/''',
  '''^node_modules/''',
  '''\.dill$''',
  '''\.flat$''',
]
regexes = [
  "pck_[a-z0-9]+",
  "idempotency_[a-z0-9_]+",
  "idem_[a-z0-9_]+",
]
