  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    :root {
      --brand-primary: #10B981;
      --brand-glow: rgba(16, 185, 129, 0.24);
      --bg-light-start: #fbfffd;
      --bg-light-mid: #eef8f3;
      --bg-light-end: #d9fae9;
      --text-light-title: #111827;
      --text-light-sub: #374151;
      --card-light-bg: rgba(255, 255, 255, 0.92);
      --card-light-border: rgba(226, 232, 240, 0.85);

      --bg-dark-start: #0A0E14;
      --bg-dark-end: #111827;
      --text-dark-title: #F9FAFB;
      --text-dark-sub: #E5E7EB;
      --card-dark-bg: rgba(31, 41, 55, 0.88);
      --card-dark-border: rgba(55, 65, 81, 0.8);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg-light-start);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
    }

    /* Light Mode Splash */
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vh, 24px);
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 18%, var(--brand-glow), transparent 34%),
        linear-gradient(135deg, var(--bg-light-start) 0%, var(--bg-light-mid) 46%, var(--bg-light-end) 100%);
      z-index: 9999;
      color: var(--text-light-title);
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Mode Splash */
    @media (prefers-color-scheme: dark) {
      body {
        background: var(--bg-dark-start);
      }

      #loading-indicator {
        background:
          radial-gradient(circle at 50% 18%, rgba(16, 185, 129, 0.18), transparent 38%),
          linear-gradient(180deg, var(--bg-dark-start) 0%, var(--bg-dark-end) 100%);
        color: var(--text-dark-title);
      }

      #loading-indicator p {
        color: var(--text-dark-sub) !important;
      }

      .loading-card {
        background: var(--card-dark-bg) !important;
        border-color: var(--card-dark-border) !important;
        color: var(--text-dark-title) !important;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35) !important;
      }

      .loading-card span {
        color: #9CA3AF !important;
      }

      .loading-note {
        color: #9CA3AF !important;
      }
    }

    .loading-brand {
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
    }

    #loading-indicator .brand-mark {
      width: clamp(92px, 14vw, 118px);
      height: clamp(92px, 14vw, 118px);
      border-radius: 30px;
      background: #39e58a;
      box-shadow:
        0 26px 70px var(--brand-glow),
        0 0 0 8px rgba(255, 255, 255, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
    }

    @media (prefers-color-scheme: dark) {
      #loading-indicator .brand-mark {
        box-shadow:
          0 26px 70px var(--brand-glow),
          0 0 0 8px rgba(31, 41, 55, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
    }

    #loading-indicator .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #loading-indicator h1 {
      margin: 0;
      color: #35dd80;
      font-size: clamp(44px, 9vw, 72px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.5px;
    }

    #loading-indicator p {
      margin: -2px 0 8px;
      font-size: clamp(17px, 3.8vw, 24px);
      font-weight: 700;
      color: var(--text-light-sub);
    }

    .loading-features {
      width: min(100%, 720px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 16px);
    }

    .loading-card {
      min-height: clamp(94px, 14vw, 112px);
      border-radius: 22px;
      background: var(--card-light-bg);
      border: 1px solid var(--card-light-border);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.07);
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 800;
      padding: 14px 10px;
      color: var(--text-light-title);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .loading-card strong {
      display: block;
      font-size: clamp(14px, 2.8vw, 18px);
      line-height: 1.15;
    }

    .loading-card span {
      display: block;
      margin-top: 6px;
      color: #6B7280;
      font-size: clamp(11px, 2.2vw, 13px);
      font-weight: 600;
      line-height: 1.25;
    }

    .loading-bar {
      width: min(100%, 720px);
      height: 10px;
      border-radius: 999px;
      background: #35d675;
      box-shadow: 0 14px 38px var(--brand-glow);
      position: relative;
      overflow: hidden;
    }

    .loading-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      animation: shimmer 1.2s ease-in-out infinite;
    }

    @keyframes shimmer {
      from {
        transform: translateX(-120%);
      }
      to {
        transform: translateX(260%);
      }
    }

    .loading-note {
      margin: -6px 0 0;
      color: #6b7280;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .loading-fallback-reload {
      display: none;
      margin-top: 4px;
      font-size: 13px;
      color: var(--brand-primary);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-indicator,
      .loading-bar::after {
        transition: none;
        animation: none;
      }
    }

    @media (max-width: 760px) {
      #loading-indicator {
        justify-content: center;
      }

      .loading-card {
        border-radius: 18px;
      }
    }

    @media (max-width: 390px) {
      #loading-indicator {
        padding-left: 18px;
        padding-right: 18px;
      }

      .loading-features {
        gap: 8px;
      }

      .loading-card {
        padding: 12px 8px;
      }
    }

    /* Live Offline Indicator Pill */
    #offline-indicator {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: #1F2937;
      color: #F9FAFB;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100000;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translate(-50%, -10px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* PWA Live Update Toast */
    #pwa-update-toast {
      display: none;
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      right: 20px;
      background: #111827;
      color: #F9FAFB;
      border: 1px solid #374151;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      padding: 12px 18px;
      z-index: 100000;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      font-weight: 600;
      animation: toastSlideUp 0.35s ease-out;
    }

    @keyframes toastSlideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #pwa-update-toast button {
      background: var(--brand-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      min-height: 36px;
      transition: opacity 0.2s;
    }

    #pwa-update-toast button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <!-- Accessible Loading status while Flutter initializes -->
  <div id="loading-indicator" role="status" aria-live="polite" aria-label="Loading Olitun">
    <div class="loading-brand">
      <div class="brand-mark">
        <img src="icons/Icon-192.png" alt="" fetchpriority="high">
      </div>
      <h1>Olitun</h1>
      <p>Learn Ol Chiki Script</p>
    </div>
    <div class="loading-features" aria-hidden="true">
      <div class="loading-card"><strong>Interactive</strong><span>Learn by doing</span></div>
      <div class="loading-card"><strong>Structured</strong><span>Step-by-step</span></div>
      <div class="loading-card"><strong>Gentle</strong><span>Daily progress</span></div>
    </div>
    <div class="loading-bar" aria-hidden="true"></div>
    <div class="loading-note" aria-hidden="true">Preparing your learning path</div>
    <button class="loading-fallback-reload" id="loading-reload-btn" type="button" aria-label="Reload application">
      Taking longer than usual? Tap to reload
    </button>
  </div>

  <!-- Live Offline Banner -->
  <div id="offline-indicator" role="status" aria-live="polite">
    <span>📡</span>
    <span>Offline Mode — Cached lessons and quizzes are ready</span>
  </div>

  <!-- Live PWA Update Toast -->
  <div id="pwa-update-toast" role="alert" aria-live="assertive">
    <span>✨ New update available!</span>
    <button id="pwa-update-btn" type="button">Update</button>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script src="pwa_install.js" defer></script>

  <script src="pwa_runtime.js" defer></script>
</body>

</html>
