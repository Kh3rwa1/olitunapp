name: Deploy Worker

# Production deploy for cloudflare/backend. Order: Worker CI must pass ->
# schema.sql applied to remote D1 (idempotent, additive) -> new version
# uploaded without traffic -> its preview URL smoke-tested -> only then
# promoted to 100%. A failed smoke test leaves production on the old version.

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/backend/**'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  ci:
    name: Worker CI
    uses: ./.github/workflows/worker-ci.yml

  deploy:
    name: Upload, smoke test, promote
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/backend
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check Cloudflare secret availability
        id: check_creds
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not yet configured in GitHub repository secrets. Worker deployment skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check_creds.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        if: steps.check_creds.outputs.configured == 'true'
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/backend/package-lock.json

      - name: Install dependencies
        if: steps.check_creds.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Apply schema.sql to remote D1
        if: steps.check_creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'bcb4692769683fbc73837789082f9096' }}
        run: npx wrangler d1 execute olitun-db --remote --file=./schema.sql -y

      - name: Upload new version (no traffic yet)
        id: upload
        if: steps.check_creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'bcb4692769683fbc73837789082f9096' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wrangler-upload.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$out" npx wrangler versions upload \
            --tag "${COMMIT_SHA:0:12}" \
            --message "GitHub Actions ${COMMIT_SHA:0:12}"
          read -r version_id preview_url < <(node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map((l) => JSON.parse(l));
            const up = lines.reverse().find((l) => l.type === "version-upload") || {};
            console.log(`${up.version_id || ""} ${up.preview_url || ""}`);
          ' "$out")
          if [ -z "$version_id" ]; then
            echo "::error::wrangler versions upload did not report a version id"
            exit 1
          fi
          if [ -z "$preview_url" ]; then
            echo "::error::No preview URL for version $version_id. Enable Preview URLs for olitun-api (dashboard, or \"preview_urls\": true in wrangler.json) so it can be smoke-tested. Not deploying."
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Uploaded $version_id ($preview_url)"

      - name: Smoke test the preview URL
        if: steps.check_creds.outputs.configured == 'true'
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          set -euo pipefail
          check() {
            local path="$1" want="$2" got=""
            # Preview URLs can take a few seconds to become routable.
            for attempt in 1 2 3 4 5 6; do
              got=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$PREVIEW_URL$path" || echo 000)
              if [ "$got" = "$want" ]; then
                echo "ok   $path -> $got"
                return 0
              fi
              sleep $((attempt * 5))
            done
            echo "::error::Smoke test failed: $path returned $got, expected $want"
            return 1
          }
          check /health 200
          check /api/v1/categories 200
          check /api/v1/review/states 401

      - name: Promote version to 100% of traffic
        if: steps.check_creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'bcb4692769683fbc73837789082f9096' }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: npx wrangler versions deploy "$VERSION_ID@100%" -y --message "GitHub Actions ${COMMIT_SHA:0:12}"
