name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC

permissions:
  contents: read

jobs:
  action-pinning-audit:
    name: GitHub Action Pinning Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify All GitHub Actions are Pinned to Commit SHAs
        run: node scripts/verify_pinned_actions.mjs

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@47f2e19d7c07b6bf744b209e5ff30e9d690a618f # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f66bbfa70cfd38e4523047a0d450854fb321 # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@850257c793ffc6a2e4b01e749e7b2354a938fc2a # v2.3.8
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --format=table

      - name: Scan npm dependencies
        uses: google/osv-scanner-action/osv-scanner-action@850257c793ffc6a2e4b01e749e7b2354a938fc2a # v2.3.8
        with:
          scan-args: |-
            --lockfile=scripts/package-lock.json
            --lockfile=functions/translator/package-lock.json
            --format=table

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@46ed16bedbd92aac4b842f495b774e8304d27038 # v4.3.0
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@46ed16bedbd92aac4b842f495b774e8304d27038 # v4.3.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@46ed16bedbd92aac4b842f495b774e8304d27038 # v4.3.0

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [action-pinning-audit, gitleaks, osv-scanner, codeql]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check All Security Scans Succeeded
        run: |
          if [ "${{ needs.action-pinning-audit.result }}" != "success" ] || \
             [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.osv-scanner.result }}" != "success" ] || \
             [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "❌ Security Gate: One or more required security scans failed or were skipped!"
            exit 1
          fi
          echo "✅ Security Gate: All security scans and action pinning passed successfully!"
