name: One-time duplicate main repair cleanup

on:
  push:
    branches:
      - fix/main-ci-after-leaderboard-animation
    paths:
      - .github/workflows/one-time-main-ci-repair.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Remove completed duplicate repair artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/one-time-main-ci-repair.yml \
            ci-main-duplicate-rerun.txt
          git commit -m 'ci: remove duplicate main repair artifacts'
          git push
