name: itun
description: Olitun - Premium Ol Chiki (Santali Script) Learning App
publish_to: 'none'
version: 1.3.1+30

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.2.3

  # Local Storage
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  flutter_animate: ^4.5.2
  flutter_web_auth_2: ^5.0.2
  flutter_flip_card: ^0.0.6
  shimmer: ^4.0.0
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.17
  fl_chart: ^1.2.0

  # Audio & Video
  # NOTE: Appwrite Sites builder is pinned to flutter-3.35 (Dart 3.9.2).
  # lottie >=3.4.0 needs Dart ^3.12 / Flutter >=3.44, so cap below 3.4.0
  # until Appwrite offers a newer Flutter build runtime.
  lottie: '>=3.3.1 <3.4.0'
  video_player: ^2.8.6



  # Auth
  # Constrained to 21.x to match backend server API (TablesDB) and prevent breaking 22+ SDK changes
  appwrite: ^21.1.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  # NOTE: image_picker >=1.2.3 needs Dart ^3.10 / Flutter >=3.38, but the
  # Appwrite Sites builder is pinned to flutter-3.35 (Dart 3.9.2).
  # Keep 1.2.x capped below 1.2.3 until the builder runtime is upgraded.
  image_picker: '>=1.2.2 <1.2.3'
  file_picker: ^10.3.10
  http: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # Capped below 2.1.6: path_provider 2.1.6 requires Dart ^3.10 / Flutter
  # >=3.38, but the Appwrite Sites builder is pinned to flutter-3.35
  # (Dart 3.9.2). Same story as lottie and image_picker above; lift the cap
  # when the builder runtime is upgraded.
  path_provider: '>=2.1.5 <2.1.6'
  web: ^1.1.1
  fpdart: ^1.1.0
  connectivity_plus: ^7.3.1
  equatable: ^2.1.0
  flutter_markdown_plus: ^1.0.12

  # Crash & error reporting
  sentry_flutter: ^9.28.0
  share_plus: ^12.0.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  razorpay_flutter: ^1.3.7
  crypto: ^3.0.6
  in_app_review: ^2.0.9
  url_launcher: ^6.3.2

  # Ads & Monetization
  google_mobile_ads: ^7.0.0

  # Notifications & Habit Retention
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

  flutter_web_plugins:
    sdk: flutter
  # 6.2.1 is the final record release before v7, which raises the floor
  # to Flutter 3.44 / Dart 3.12 (above the Appwrite Sites builder runtime).
  # 6.x also keeps the hasPermission() signature our code and the
  # record_linux platform package agree on.
  record: 6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  just_audio_platform_interface: ^4.6.0
  video_player_platform_interface: ^6.7.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/animations/avatars/
    - assets/seed/
    - assets/audio/



  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: OlChiki
      fonts:
        - asset: assets/fonts/OlChiki.ttf
