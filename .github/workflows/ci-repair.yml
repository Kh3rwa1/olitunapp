name: Temporary CI failure diagnostics
on:
  push:
    branches: [fix/review-priority-hardening-20260905]
    paths: [.github/workflows/ci-repair.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: priority-ci-repair
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/review-priority-hardening-20260905
      - name: Retrieve failed checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view 33953278225 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed-checks.log 2>&1
      - name: Persist focused failure details
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/failed-checks.log')
          original=(p.read_text() if p.exists() else 'No log produced').splitlines()
          lines=[re.sub(r'^\S+Z ', '', line.split('\t',2)[-1]).replace('\ufeff','') for line in original]
          keep=set()
          inside=False
          for i,line in enumerate(lines):
            if '##[group]❌' in line: inside=True
            if inside: keep.add(i)
            if '##[endgroup]' in line: inside=False
            if original[i].startswith('Code Formatting') or original[i].startswith('Release Gate'):
              keep.add(i)
            if '##[error]' in line or 'tests passed' in line or '[E]' in line:
              keep.update(range(max(0,i-2),min(len(lines),i+10)))
          text='\n'.join(lines[i] for i in sorted(keep))
          Path('docs/CI_REPAIR_DIAGNOSTICS.txt').write_text('Failed source: 6ce0c8de5e29bad504725ed83a217f9ee5fe9938\n'+text[:55000])
          PY
          git config user.name 'Notion AI'
          git config user.email 'noreply@notion.so'
          git add docs/CI_REPAIR_DIAGNOSTICS.txt
          git diff --cached --quiet || git commit -m 'chore: record focused failed check diagnostics'
          git push origin HEAD:fix/review-priority-hardening-20260905
