name: Flutter CI

on:
  push:
    branches: [ main, 'hardening/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-analyze:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Verify Version Consistency
        run: dart run tool/verify_version_consistency.dart
      - name: Analyze
        run: flutter analyze --fatal-infos

  flutter-unit-widget-tests:
    name: Flutter Unit, Widget & Coverage Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Flutter tests with coverage
        run: flutter test --coverage --concurrency=4
      - name: Enforce coverage threshold
        run: |
          dart run tool/enforce_coverage.dart \
            --min=70 \
            --path-min=/data/:40 \
            --path-min=/domain/:70 \
            --path-min=/core/auth/:50 \
            --enforce-after=2026-06-21
      - name: Smoke tests
        run: flutter test test/smoke
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  node-backend-tests:
    name: Node Serverless Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run backend Serverless Node tests
        run: npm run test:backend

  permission-and-schema-tests:
    name: Appwrite Permission Invariants & Schema Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Appwrite permission invariant unit tests
        run: flutter test test/core/api/appwrite_permission_invariants_test.dart
      - name: Run staging permission integration test (dry-run)
        run: node scripts/staging_permission_test.mjs
      - name: Run service worker patch unit tests
        run: node scripts/patch_service_worker.test.mjs
      - name: Detect Appwrite schema drift
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "⚠️ SKIPPED: Fork PR (${{ github.event.pull_request.head.repo.full_name }}) does not have access to repository secrets."
              exit 0
            fi
            echo "❌ FAIL: Missing required repository secret APPWRITE_API_KEY!"
            echo "👉 Action Required: Repository admin must configure APPWRITE_API_KEY in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          node scripts/snapshot_appwrite_schema.mjs
          if ! git diff --exit-code test/fixtures/schema/; then
            echo "❌ FAIL: Appwrite schema drift detected!"
            git --no-pager diff -- test/fixtures/schema/
            exit 1
          fi

  web-release-build:
    name: Web Release Build & Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Load performance budgets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:tool/performance_budgets.json > /tmp/base_performance_budgets.json
      - name: Build Web Release
        run: |
          BUILD_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release \
            --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 \
            --dart-define=APPWRITE_PROJECT_ID=ci \
            --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions \
            --dart-define=BUILD_SHA=$BUILD_SHA \
            --dart-define=BUILT_AT=$BUILT_AT
          
          mkdir -p build/web
          echo "{\"sha\": \"$BUILD_SHA\", \"builtAt\": \"$BUILT_AT\"}" > build/web/build-info.json
          
          node scripts/patch_service_worker.mjs
          node scripts/verify_service_worker_patch.mjs
          (cd build/web && find . -type f -exec sha256sum {} + | sort > manifest.sha256)
      - name: Check Web performance budget
        run: dart run tool/check_size_budget.dart --path=build/web --budget-key=webBuildBytes --baseline=/tmp/base_performance_budgets.json --max-growth=5
      - name: Upload Web Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-build
          path: build/web/
          retention-days: 14

  android-release-build:
    name: Android APK Release Build & Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Load performance budgets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:tool/performance_budgets.json > /tmp/base_performance_budgets.json
      - name: Build Android Release APK
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: |
          flutter build apk --release \
            --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 \
            --dart-define=APPWRITE_PROJECT_ID=ci \
            --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256)
      - name: Check APK performance budget
        run: dart run tool/check_size_budget.dart --path=build/app/outputs/flutter-apk/app-release.apk --budget-key=apkReleaseBytes --baseline=/tmp/base_performance_budgets.json --max-growth=5
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 14

  artifact-verification:
    name: Verify Release Artifact Integrity
    runs-on: ubuntu-latest
    needs: [flutter-unit-widget-tests, web-release-build, android-release-build]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release-build
          path: artifacts/web/
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: artifacts/apk/
      - name: Verify Non-Empty & Provenance Checksums
        run: bash scripts/verify_release_artifacts.sh "${{ github.sha }}"

  integration-tests-chrome:
    name: Chrome Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: flutter pub get
      - name: Start ChromeDriver and Run Integration Tests
        run: |
          chromedriver --port=4444 &
          CHROMEDRIVER_PID=$!
          trap 'kill $CHROMEDRIVER_PID || true' EXIT
          sleep 3

          TEST_FILES=(
            "integration_test/auth_flow_test.dart"
            "integration_test/legal_smoke_test.dart"
            "integration_test/quiz_flow_test.dart"
            "integration_test/journeys_integration_test.dart"
          )

          for test_file in "${TEST_FILES[@]}"; do
            echo "----------------------------------------"
            echo "Running $test_file on Chrome..."
            echo "----------------------------------------"
            xvfb-run --auto-servernum flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$test_file" \
              -d chrome \
              --web-browser-flag="--headless" \
              --web-browser-flag="--no-sandbox" \
              --web-browser-flag="--disable-gpu"
          done

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [format-and-analyze, flutter-unit-widget-tests, node-backend-tests, permission-and-schema-tests, web-release-build, android-release-build, integration-tests-chrome, artifact-verification]
    if: always()
    steps:
      - name: Check All Dependencies Succeeded
        run: |
          if [ "${{ needs.format-and-analyze.result }}" != "success" ] || \
             [ "${{ needs.flutter-unit-widget-tests.result }}" != "success" ] || \
             [ "${{ needs.node-backend-tests.result }}" != "success" ] || \
             [ "${{ needs.permission-and-schema-tests.result }}" != "success" ] || \
             [ "${{ needs.web-release-build.result }}" != "success" ] || \
             [ "${{ needs.android-release-build.result }}" != "success" ] || \
             [ "${{ needs.integration-tests-chrome.result }}" != "success" ] || \
             [ "${{ needs.artifact-verification.result }}" != "success" ]; then
            echo "❌ Release Gate: One or more required CI jobs failed or were skipped!"
            exit 1
          fi
          echo "✅ Release Gate: All required CI jobs passed successfully!"
