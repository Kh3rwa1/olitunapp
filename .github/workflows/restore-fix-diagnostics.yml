name: Restore fix diagnostics (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: restore-fix-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/resumable-restore-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
      - name: Wire reviewed restore implementation
        run: |
          if ! grep -q 'return runResumableRestore({' functions/admin-maintenance/src/main.js; then
            python3 tool/wire_resumable_restore.py
          fi
          npm install --prefix functions/admin-maintenance --ignore-scripts --save-exact node-appwrite@27.1.0
          flutter pub get
          dart format lib/core/auth/admin_restore_client.dart lib/features/admin/presentation/settings/controllers/admin_maintenance_controller.dart lib/features/admin/presentation/settings/admin_settings_screen.dart lib/features/admin/presentation/settings/sections/admin_danger_zone_section.dart lib/features/admin/presentation/settings/widgets/admin_restore_dialog.dart test/core/auth/admin_restore_client_test.dart
      - name: Run focused validation
        run: |
          set +e
          node --check functions/admin-maintenance/src/main.js > /tmp/restore-node.log 2>&1
          syntax=$?
          node --test functions/test/resumable_restore.test.js functions/test/admin_restore_runtime.test.js functions/test/admin_restore_sdk_contract.test.js >> /tmp/restore-node.log 2>&1
          node_tests=$?
          flutter analyze --fatal-infos > /tmp/restore-analyze.log 2>&1
          analyze=$?
          flutter test test/core/auth/admin_restore_client_test.dart --reporter expanded > /tmp/restore-flutter.log 2>&1
          flutter_tests=$?
          printf 'Syntax exit: %s\nNode exit: %s\nAnalyze exit: %s\nFlutter exit: %s\n' "$syntax" "$node_tests" "$analyze" "$flutter_tests" > /tmp/restore-status.log
      - name: Save generated wiring only to review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add functions/admin-maintenance/src/main.js functions/admin-maintenance/package.json functions/admin-maintenance/package-lock.json appwrite.json lib/core/auth/admin_restore_client.dart lib/features/admin/presentation/settings test/core/auth/admin_restore_client_test.dart
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(admin): wire checkpointed restore and format recovery UI'
            gh auth setup-git
            git push origin HEAD:refs/heads/fix/resumable-restore-20260906
          fi
      - name: Report validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo '## Restore recovery validation'
            echo
            echo "Head: $(git rev-parse HEAD)"
            echo
            echo '```text'
            cat /tmp/restore-status.log
            echo '```'
            for file in /tmp/restore-node.log /tmp/restore-analyze.log /tmp/restore-flutter.log; do
              echo '```text'
              tail -c 11000 "$file"
              echo
              echo '```'
            done
          } > /tmp/restore-report.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/restore-report.md
