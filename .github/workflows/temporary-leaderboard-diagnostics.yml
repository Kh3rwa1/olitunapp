name: Temporary leaderboard diagnostics

on:
  push:
    branches: [ feat/profile-leaderboard-badge ]

permissions:
  contents: write

jobs:
  diagnose-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/profile-leaderboard-badge
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture exact format and analyzer output
        run: |
          set +e
          {
            echo "== dart format =="
            dart format --output=none --set-exit-if-changed .
            echo "format_status=$?"
            echo "== flutter analyze =="
            flutter analyze --fatal-infos
            echo "analyze_status=$?"
          } > ci-leaderboard-diagnostics.txt 2>&1
          exit 0
      - name: Remove one-off workflow and commit diagnostics
        run: |
          git rm .github/workflows/temporary-leaderboard-diagnostics.yml
          git add ci-leaderboard-diagnostics.txt
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@localhost"
          git commit -m "ci: record leaderboard analyzer diagnostics"
          git push origin HEAD:feat/profile-leaderboard-badge
