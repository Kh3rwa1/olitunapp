name: Apply isolated priority hardening
on:
  push:
    branches: [fix/review-priority-hardening-20260905]
    paths: [scripts/apply_priority_hardening.py, scripts/refine_priority_hardening.py, .github/workflows/apply-priority-hardening.yml]
permissions:
  contents: write
  issues: write
jobs:
  apply:
    if: github.repository == 'Kh3rwa1/olitunapp' && github.ref == 'refs/heads/fix/review-priority-hardening-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/review-priority-hardening-20260905
          fetch-depth: 2
      - name: Apply exact-match changes
        run: |
          if [ -f scripts/refine_priority_hardening.py ]; then python3 scripts/refine_priority_hardening.py; fi
          python3 scripts/apply_priority_hardening.py 2>&1 | tee /tmp/priority.log
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files and check JavaScript
        run: |
          python3 - <<'PY' 2>&1 | tee -a /tmp/priority.log
          import json, subprocess
          paths=json.load(open('/tmp/priority_changed_paths.json'))
          subprocess.run(['dart','format',*[p for p in paths if p.endswith('.dart')]],check=True)
          for p in paths:
            if p.endswith(('.js','.mjs')): subprocess.run(['node','--check',p],check=True)
          PY
          node scripts/verify_function_deployment.mjs 2>&1 | tee -a /tmp/priority.log
      - name: Commit only reviewed changes and remove temporary automation
        run: |
          python3 - <<'PY' 2>&1 | tee -a /tmp/priority.log
          import json, subprocess
          paths=json.load(open('/tmp/priority_changed_paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm --ignore-unmatch scripts/apply_priority_hardening.py scripts/refine_priority_hardening.py .github/workflows/apply-priority-hardening.yml
          git config user.name 'Notion AI'
          git config user.email 'noreply@notion.so'
          git commit -m 'fix: enforce consent durable sync entitlement refresh and release safeguards'
          git push origin HEAD:refs/heads/fix/review-priority-hardening-20260905
      - name: Install dependencies
        run: |
          flutter pub get 2>&1 | tee -a /tmp/priority.log
          npm ci 2>&1 | tee -a /tmp/priority.log
          npm ci --prefix functions/translator 2>&1 | tee -a /tmp/priority.log
      - name: Validate implementation
        run: |
          flutter analyze --fatal-infos 2>&1 | tee -a /tmp/priority.log
          flutter test test/core/ads test/core/payments test/shared/offline 2>&1 | tee -a /tmp/priority.log
          npm test 2>&1 | tee -a /tmp/priority.log
      - name: Publish diagnostics to this draft only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/priority.log')
          text=p.read_text()[-24000:] if p.exists() else 'No patch output; see workflow run.'
          pathlib.Path('/tmp/comment.json').write_text(json.dumps({'body':'Priority hardening validation log (no production services invoked):\n```text\n'+text+'\n```'}))
          PY
          gh api repos/Kh3rwa1/olitunapp/issues/250/comments --input /tmp/comment.json
