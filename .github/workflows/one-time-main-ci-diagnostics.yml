name: One-time main CI diagnostics

on:
  push:
    branches:
      - fix/main-ci-after-leaderboard-animation
    paths:
      - .github/workflows/one-time-main-ci-diagnostics.yml

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Capture current main status and failed web log
        shell: bash
        run: |
          set -euo pipefail
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          {
            echo "TARGET_SHA=$target_sha"
            echo "COLLECTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "===== WORKFLOW RUNS ====="
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$target_sha&per_page=100" \
              --jq '.workflow_runs | sort_by(.id) | reverse[] | [.id, .name, .event, .run_attempt, .status, (.conclusion // ""), .html_url] | @tsv'
            echo "===== CHECK RUNS ====="
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$target_sha/check-runs?per_page=100" \
              --jq '.check_runs | sort_by(.id) | reverse[] | [(.id|tostring), .name, .status, (.conclusion // ""), (.details_url // "")] | @tsv'
            echo "===== FAILED WEB RELEASE JOB ====="
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/103104377469" \
              --jq '[.id, .name, .status, (.conclusion // ""), .html_url, (.steps[] | select(.conclusion == "failure") | .name)] | @tsv'
            echo "===== FAILED WEB RELEASE LOG ====="
          } > ci-main-diagnostics.txt

          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/103104377469/logs" > /tmp/web-release-log.zip
          if unzip -tqq /tmp/web-release-log.zip >/dev/null 2>&1; then
            unzip -p /tmp/web-release-log.zip | tail -n 800 >> ci-main-diagnostics.txt
          else
            tail -n 800 /tmp/web-release-log.zip >> ci-main-diagnostics.txt
          fi
          cat ci-main-diagnostics.txt
      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-main-diagnostics.txt
          git commit -m 'ci: record failed main web release log'
          git push
