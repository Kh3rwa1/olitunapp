name: Hardening Autofix (Temporary)

on:
  push:
    branches: ['hardening/production-readiness-20260916']
    paths: ['.github/workflows/hardening-autofix.yml']

permissions:
  contents: write

jobs:
  format-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/offline/mutation_outbox_service.dart \
            lib/shared/offline/content_mutation_replay.dart \
            test/core/offline/mutation_outbox_regression_test.dart
      - name: Capture analyzer result
        run: |
          set +e
          flutter analyze --fatal-infos > /tmp/hardening-analyze.log 2>&1
          echo "$?" > /tmp/hardening-analyze.status
          exit 0
      - name: Commit formatter output and diagnostics
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(cat /tmp/hardening-analyze.status)
          if [ "$status" -ne 0 ]; then
            cp /tmp/hardening-analyze.log .ci-hardening-diagnostics.txt
          else
            rm -f .ci-hardening-diagnostics.txt
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/core/offline/mutation_outbox_service.dart \
            lib/shared/offline/content_mutation_replay.dart \
            test/core/offline/mutation_outbox_regression_test.dart \
            .ci-hardening-diagnostics.txt || true
          if git diff --cached --quiet; then
            echo 'No formatter or diagnostics changes to commit.'
            exit 0
          fi
          git commit -m 'style: apply Dart formatter to hardening changes'
          git push origin "HEAD:$BRANCH"
