name: One-time main CI verification

on:
  push:
    branches:
      - fix/main-ci-after-profile-cleanup
    paths:
      - .github/workflows/one-time-main-ci-diagnostics.yml

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verification branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Collect repaired main status
        shell: bash
        run: |
          set -euo pipefail
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          {
            echo "TARGET_SHA=$target_sha"
            echo "===== KEY WORKFLOW RUNS ====="
            for run_id in 34511637243 34511637184 34512024872; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq '[.id, .name, .event, .run_attempt, .status, (.conclusion // ""), .html_url] | @tsv'
            done
            echo "===== CHECK RUNS ====="
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$target_sha/check-runs?per_page=100" \
              --jq '.check_runs | sort_by(.id) | reverse[] | [(.id|tostring), .name, .status, (.conclusion // ""), (.details_url // "")] | @tsv'
          } > ci-main-final-status.txt
          cat ci-main-final-status.txt
      - name: Commit verification report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-main-final-status.txt
          git commit -m 'ci: record repaired main status'
          git push
