name: Account scope diagnostics (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: account-scope-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/offline-account-scoping-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
      - name: Migrate fixtures and format changes
        run: |
          if ! grep -q 'AccountScope.beginSignIn' test/features/profile/progress_merge_concurrency_test.dart; then
            python3 tool/migrate_account_scope_fixtures.py
          fi
          if ! grep -q 'bool preserveAccount' lib/core/auth/appwrite_auth_service.dart; then
            python3 tool/fix_session_scope_edges.py
          fi
          flutter pub get
          git diff --name-only origin/main...HEAD -- '*.dart' | xargs -r dart format
      - name: Validate auth and profile behavior
        run: |
          set +e
          flutter analyze --fatal-infos > /tmp/scope-analyze.log 2>&1
          analyze=$?
          flutter test test/core/auth test/features/auth test/features/profile --reporter expanded > /tmp/scope-tests.log 2>&1
          tests=$?
          printf 'Analyze exit: %s\nAuth/profile test exit: %s\n' "$analyze" "$tests" > /tmp/scope-status.log
      - name: Commit reviewed migration only to review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add lib/core/auth lib/features/auth lib/features/profile test/core/auth test/features/auth test/features/profile
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(auth): retain offline owner across credential expiry'
            gh auth setup-git
            git push origin HEAD:refs/heads/fix/offline-account-scoping-20260906
          fi
      - name: Report evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo '## Account scope validation'
            echo
            echo "Head: $(git rev-parse HEAD)"
            echo '```text'
            cat /tmp/scope-status.log
            tail -c 5000 /tmp/scope-analyze.log
            grep -B2 -A22 '\[E\]' /tmp/scope-tests.log | head -c 24000 || true
            tail -n 12 /tmp/scope-tests.log
            echo
            echo '```'
          } > /tmp/scope-report.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/scope-report.md
