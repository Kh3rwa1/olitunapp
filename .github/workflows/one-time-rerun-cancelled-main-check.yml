name: One-time rerun cancelled main check

on:
  push:
    branches:
      - fix/sync-appwrite-runtime-config-20260910
    paths:
      - .github/workflows/one-time-rerun-cancelled-main-check.yml

permissions:
  actions: write
  contents: write

jobs:
  rerun-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rerun cancelled workflow and wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RUN_ID='34455909511'
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun"

          for _ in $(seq 1 120); do
            STATUS="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status')"
            CONCLUSION="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion // "pending"')"
            echo "status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = 'completed' ]; then
              if [ "$CONCLUSION" != 'success' ]; then
                echo "::error::Rerun completed with conclusion: $CONCLUSION"
                exit 1
              fi
              {
                echo '# Main attached check repaired'
                echo
                echo "Run $RUN_ID completed successfully on rerun."
              } > ci-main-check-rerun-result.md
              exit 0
            fi
            sleep 15
          done
          echo '::error::Timed out waiting for the rerun.'
          exit 1

      - name: Commit successful rerun result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-main-check-rerun-result.md
          git commit -m 'ci: confirm cancelled main check rerun passed'
          git push origin HEAD:${GITHUB_REF_NAME}
