name: Finalize Secure Lesson Listing (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/finalize-secure-listing.yml']

concurrency:
  group: finalize-secure-listing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/translator/package-lock.json
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Apply final hardening patch
        run: python3 scripts/finalize_secure_listing.py
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions/translator
          flutter pub get
      - name: Verify and capture diagnostics
        run: |
          set +e
          : > /tmp/finalize-secure-listing.log
          dart format \
            lib/shared/repositories/content_repository.dart \
            lib/shared/models/content_item/content_item_serialization.dart \
            test/shared/repositories/content_repository_authorized_lesson_test.dart \
            >> /tmp/finalize-secure-listing.log 2>&1
          format_status=$?
          node --check scripts/check_premium_content_permissions.mjs \
            >> /tmp/finalize-secure-listing.log 2>&1
          permission_syntax_status=$?
          node --check functions/getAuthorizedLesson/src/main.js \
            >> /tmp/finalize-secure-listing.log 2>&1
          function_syntax_status=$?
          node --check functions/getAuthorizedLesson/src/list-lessons.js \
            >> /tmp/finalize-secure-listing.log 2>&1
          listing_syntax_status=$?
          node --check scripts/appwrite_setup.mjs \
            >> /tmp/finalize-secure-listing.log 2>&1
          setup_syntax_status=$?
          node --check scripts/verify_live_appwrite_system.mjs \
            >> /tmp/finalize-secure-listing.log 2>&1
          verifier_syntax_status=$?
          npm run test:backend >> /tmp/finalize-secure-listing.log 2>&1
          backend_status=$?
          flutter analyze --fatal-infos >> /tmp/finalize-secure-listing.log 2>&1
          analyze_status=$?
          flutter test \
            test/features/lessons/lesson_remote_datasource_authorized_test.dart \
            test/features/lessons/lesson_remote_datasource_list_authorized_test.dart \
            test/shared/repositories/content_repository_authorized_lesson_test.dart \
            test/shared/repositories/content_repository_cached_list_test.dart \
            test/shared/repositories/content_repository_lesson_upsert_test.dart \
            >> /tmp/finalize-secure-listing.log 2>&1
          flutter_test_status=$?
          printf 'format=%s permission_syntax=%s function_syntax=%s listing_syntax=%s setup_syntax=%s verifier_syntax=%s backend=%s analyze=%s flutter_tests=%s\n' \
            "$format_status" "$permission_syntax_status" "$function_syntax_status" \
            "$listing_syntax_status" "$setup_syntax_status" "$verifier_syntax_status" \
            "$backend_status" "$analyze_status" "$flutter_test_status" \
            >> /tmp/finalize-secure-listing.log
          if [ "$format_status" -eq 0 ] && \
             [ "$permission_syntax_status" -eq 0 ] && \
             [ "$function_syntax_status" -eq 0 ] && \
             [ "$listing_syntax_status" -eq 0 ] && \
             [ "$setup_syntax_status" -eq 0 ] && \
             [ "$verifier_syntax_status" -eq 0 ] && \
             [ "$backend_status" -eq 0 ] && \
             [ "$analyze_status" -eq 0 ] && \
             [ "$flutter_test_status" -eq 0 ]; then
            echo 0 > /tmp/finalize-secure-listing.status
          else
            echo 1 > /tmp/finalize-secure-listing.status
          fi
          exit 0
      - name: Commit verified hardening and clean temporary files
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(cat /tmp/finalize-secure-listing.status)
          if [ "$status" -ne 0 ]; then
            cp /tmp/finalize-secure-listing.log .ci-secure-listing-diagnostics.txt
          else
            rm -f .ci-secure-listing-diagnostics.txt
          fi
          rm -f \
            .ci-lesson-boundary-audit.txt \
            .github/workflows/secure-listing-autofix.yml \
            .github/workflows/finalize-secure-listing.yml \
            scripts/patch_secure_listing.py \
            scripts/audit_lesson_boundary.py \
            scripts/finalize_secure_listing.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(security): finalize premium lesson cutover safeguards'
          git push origin "HEAD:$BRANCH"
          exit "$status"
