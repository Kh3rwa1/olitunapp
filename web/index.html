<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- SEO & PWA Meta -->
  <meta name="application-name" content="Olitun">
  <meta name="description"
    content="Olitun is a Santali and Ol Chiki learning coach with lessons, Bakhed listening, quizzes, mistake review, and gentle daily progress.">
  <meta name="theme-color" content="#10B981">
  <meta name="color-scheme" content="dark light">
  <meta name="format-detection" content="telephone=no">

  <!-- Open Graph -->
  <meta property="og:title" content="Olitun - Learn Ol Chiki">
  <meta property="og:description"
    content="A warm Santali learning coach for Ol Chiki lessons, Bakhed listening, quizzes, and daily practice.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://olitunapp.appwrite.network/">
  <meta property="og:image" content="https://olitunapp.appwrite.network/screenshots/welcome-wide.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS PWA Meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Olitun">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Olitun - Learn Ol Chiki</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://sgp.cloud.appwrite.io" crossorigin>
  <link rel="dns-prefetch" href="https://sgp.cloud.appwrite.io">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Preload critical fonts -->
  <style>
    /* Splash screen styling while Flutter loads */
    body {
      margin: 0;
      background: linear-gradient(135deg, #fbfffd 0%, #eef8f3 46%, #d9fae9 100%);
      overflow: hidden;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vh, 24px);
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 18%, rgba(16, 185, 129, 0.24), transparent 34%),
        linear-gradient(135deg, #fbfffd 0%, #eef8f3 46%, #d9fae9 100%);
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #111827;
      transition: opacity 0.4s ease;
    }

    .loading-brand {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    #loading-indicator .brand-mark {
      width: clamp(92px, 14vw, 118px);
      height: clamp(92px, 14vw, 118px);
      border-radius: 30px;
      background: #39e58a;
      box-shadow:
        0 26px 70px rgba(16, 185, 129, 0.24),
        0 0 0 8px rgba(255, 255, 255, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #loading-indicator .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #loading-indicator h1 {
      margin: 0;
      color: #35dd80;
      font-size: clamp(46px, 9vw, 76px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0;
    }

    #loading-indicator p {
      margin: -4px 0 10px;
      font-size: clamp(17px, 3.8vw, 24px);
      font-weight: 700;
      color: #374151;
    }

    .loading-features {
      width: min(100%, 720px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 16px);
    }

    .loading-card {
      min-height: clamp(94px, 14vw, 112px);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(226, 232, 240, 0.82);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.07);
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 800;
      padding: 14px 10px;
      box-sizing: border-box;
      color: #111827;
    }

    .loading-card strong {
      display: block;
      font-size: clamp(14px, 2.8vw, 18px);
      line-height: 1.1;
    }

    .loading-card span {
      display: block;
      margin-top: 8px;
      color: #9ca3af;
      font-size: clamp(11px, 2.2vw, 13px);
      font-weight: 700;
      line-height: 1.25;
    }

    .loading-bar {
      width: min(100%, 720px);
      height: 12px;
      border-radius: 999px;
      background: #35d675;
      box-shadow: 0 18px 46px rgba(16, 185, 129, 0.24);
      position: relative;
      overflow: hidden;
    }

    .loading-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      animation: shimmer 1.1s ease-in-out infinite;
    }

    @keyframes shimmer {
      from {
        transform: translateX(-120%);
      }
      to {
        transform: translateX(260%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-indicator,
      .loading-bar::after {
        transition: none;
        animation: none;
      }
    }

    .loading-note {
      margin: -8px 0 0;
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 760px) {
      #loading-indicator {
        justify-content: center;
      }

      .loading-card {
        border-radius: 18px;
      }
    }

    @media (max-width: 390px) {
      #loading-indicator {
        padding-left: 18px;
        padding-right: 18px;
      }

      .loading-features {
        gap: 8px;
      }

      .loading-card {
        padding: 12px 8px;
      }
    }

    /* Offline indicator */
    #offline-indicator {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #EF4444;
      color: #fff;
      text-align: center;
      padding: 6px;
      font-size: 13px;
      font-family: -apple-system, sans-serif;
      z-index: 100000;
    }
  </style>
</head>

<body>
  <!-- Loading indicator shown while Flutter initializes -->
  <div id="loading-indicator" role="status" aria-live="polite" aria-label="Loading Olitun">
    <div class="loading-brand">
      <div class="brand-mark">
        <img src="icons/Icon-192.png" alt="" fetchpriority="high">
      </div>
      <h1>Olitun</h1>
      <p>Learn Ol Chiki Script</p>
    </div>
    <div class="loading-features" aria-hidden="true">
      <div class="loading-card"><strong>Interactive</strong><span>Learn by doing</span></div>
      <div class="loading-card"><strong>Structured</strong><span>Step-by-step</span></div>
      <div class="loading-card"><strong>Gentle</strong><span>Daily progress</span></div>
    </div>
    <div class="loading-bar" aria-hidden="true"></div>
    <div class="loading-note" aria-hidden="true">Preparing your learning path</div>
  </div>

  <!-- Offline indicator -->
  <div id="offline-indicator">You are offline. Some features may be unavailable.</div>

  <script src="flutter_bootstrap.js" async></script>
  <script src="pwa_install.js" defer></script>

  <script>
    // Remove loading indicator when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });

    // Offline/Online detection
    window.addEventListener('offline', function() {
      document.getElementById('offline-indicator').style.display = 'block';
    });
    window.addEventListener('online', function() {
      document.getElementById('offline-indicator').style.display = 'none';
    });
  </script>
</body>

</html>
