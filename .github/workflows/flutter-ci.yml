name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: dart run tool/enforce_coverage.dart --min=65

      - name: Smoke tests
        run: flutter test test/smoke

      - name: Staging Appwrite smoke test
        env:
          STAGING_APPWRITE_ENDPOINT: ${{ secrets.STAGING_APPWRITE_ENDPOINT }}
          STAGING_APPWRITE_PROJECT_ID: ${{ secrets.STAGING_APPWRITE_PROJECT_ID }}
        run: |
          if [ -z "$STAGING_APPWRITE_ENDPOINT" ] || [ -z "$STAGING_APPWRITE_PROJECT_ID" ]; then
            echo "Skipping staging Appwrite smoke test; secrets are not configured."
            exit 0
          fi
          flutter test test/integration/appwrite_staging_smoke_test.dart \
            --dart-define=STAGING_APPWRITE_ENDPOINT="$STAGING_APPWRITE_ENDPOINT" \
            --dart-define=STAGING_APPWRITE_PROJECT_ID="$STAGING_APPWRITE_PROJECT_ID"

      - name: Check outdated dependencies
        run: flutter pub outdated --no-dev-dependencies || true

      - name: Build web release
        run: flutter build web --release --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 --dart-define=APPWRITE_PROJECT_ID=ci --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions

      - name: Build Android release
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: flutter build apk --release --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 --dart-define=APPWRITE_PROJECT_ID=ci --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
