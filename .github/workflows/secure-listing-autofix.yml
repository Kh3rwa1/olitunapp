name: Diagnose Secure Lesson Read Patch (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/secure-listing-autofix.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Capture deterministic patch failure
        run: |
          set +e
          python3 scripts/patch_secure_listing.py > /tmp/secure-read-patch.log 2>&1
          status=$?
          echo "patch_status=$status" >> /tmp/secure-read-patch.log
          git reset --hard HEAD
          cp /tmp/secure-read-patch.log .ci-secure-listing-diagnostics.txt
          exit 0
      - name: Commit diagnostic
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-secure-listing-diagnostics.txt
          git commit -m 'chore(security): capture secure read patch error'
          git push origin "HEAD:$BRANCH"
