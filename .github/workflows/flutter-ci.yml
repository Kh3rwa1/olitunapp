name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: |
          dart run tool/enforce_coverage.dart \
            --min=65 \
            --path-min=/data/:75 \
            --path-min=/domain/:75 \
            --enforce-after=2026-06-21

      - name: Smoke tests
        run: flutter test test/smoke

      - name: Run backend payment function Node tests
        run: |
          npm ci || npm install
          node --test functions/test/payment_functions.test.js

      - name: Detect Appwrite schema drift
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "Skipping Appwrite schema drift detection; APPWRITE_API_KEY secret is not configured."
            exit 0
          fi
          node scripts/snapshot_appwrite_schema.mjs
          if ! git diff --exit-code test/fixtures/schema/; then
            echo "❌ Appwrite schema drift detected. Run snapshot locally and commit."
            exit 1
          fi

      - name: Staging Appwrite smoke test
        env:
          STAGING_APPWRITE_ENDPOINT: ${{ secrets.STAGING_APPWRITE_ENDPOINT }}
          STAGING_APPWRITE_PROJECT_ID: ${{ secrets.STAGING_APPWRITE_PROJECT_ID }}
        run: |
          if [ -z "$STAGING_APPWRITE_ENDPOINT" ] || [ -z "$STAGING_APPWRITE_PROJECT_ID" ]; then
            echo "Skipping staging Appwrite smoke test; secrets are not configured."
            exit 0
          fi
          flutter test test/integration/appwrite_staging_smoke_test.dart \
            --dart-define=STAGING_APPWRITE_ENDPOINT="$STAGING_APPWRITE_ENDPOINT" \
            --dart-define=STAGING_APPWRITE_PROJECT_ID="$STAGING_APPWRITE_PROJECT_ID"

      - name: Check outdated dependencies
        run: flutter pub outdated --no-dev-dependencies || true

      - name: Load base performance budgets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          git show "origin/$BASE_REF:tool/performance_budgets.json" > /tmp/base_performance_budgets.json || cp tool/performance_budgets.json /tmp/base_performance_budgets.json

      - name: Run service worker patch Node tests
        run: node scripts/patch_service_worker.test.mjs

      - name: Build web release
        run: |
          BUILD_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release \
            --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 \
            --dart-define=APPWRITE_PROJECT_ID=ci \
            --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions \
            --dart-define=BUILD_SHA=$BUILD_SHA \
            --dart-define=BUILT_AT=$BUILT_AT
          
          mkdir -p build/web
          echo "{\"sha\": \"$BUILD_SHA\", \"builtAt\": \"$BUILT_AT\"}" > build/web/build-info.json
          
          node scripts/patch_service_worker.mjs
          node scripts/verify_service_worker_patch.mjs

      - name: Check web performance budget
        run: dart run tool/check_size_budget.dart --path=build/web --budget-key=webBuildBytes --baseline=/tmp/base_performance_budgets.json --max-growth=5

      - name: Analyze Android release size
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: flutter build apk --release --analyze-size --target-platform android-arm64 --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 --dart-define=APPWRITE_PROJECT_ID=ci --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions

      - name: Build Android release
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: flutter build apk --release --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 --dart-define=APPWRITE_PROJECT_ID=ci --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions

      - name: Check APK performance budget
        run: dart run tool/check_size_budget.dart --path=build/app/outputs/flutter-apk/app-release.apk --budget-key=apkReleaseBytes --baseline=/tmp/base_performance_budgets.json --max-growth=5

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
