name: Temporary CI repair verification
on:
  push:
    branches: [fix/review-priority-hardening-20260905]
    paths: [.github/workflows/ci-repair.yml]
permissions:
  contents: write
concurrency:
  group: priority-ci-repair
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/review-priority-hardening-20260905
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Simplify exhaustive collection mappings without changing behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/shared/repositories/content_repository.dart')
          s=p.read_text()
          start=s.index('  String _getCollectionId(ContentKind kind) {')
          end=s.index('  bool _hasOrderAttribute',start)
          replacement="""  String _getCollectionId(ContentKind kind) => switch (kind) {
              ContentKind.letter => 'letters',
              ContentKind.number => 'numbers',
              ContentKind.word => 'words',
              ContentKind.sentence => 'sentences',
              ContentKind.lesson => 'lessons',
              ContentKind.rhyme => 'rhymes',
            };
          
            String? _categoryAttribute(ContentKind kind) => switch (kind) {
              ContentKind.lesson || ContentKind.rhyme => 'categoryId',
              ContentKind.word || ContentKind.sentence => 'category',
              ContentKind.letter || ContentKind.number => null,
            };
          
          """
          p.write_text(s[:start]+replacement+s[end:])
          PY
          dart format lib/shared/repositories/content_repository.dart
          git config user.name 'Notion AI'
          git config user.email 'noreply@notion.so'
          git add lib/shared/repositories/content_repository.dart
          git commit -m 'refactor: use exhaustive content collection switch expressions'
          git push origin HEAD:fix/review-priority-hardening-20260905
      - name: Run all formatting and static policy gates
        run: |
          python3 - <<'PY' > /tmp/gates.log 2>&1
          import subprocess
          commands=[['dart','format','--output=none','--set-exit-if-changed','.']]
          for name in ['check_file_length','check_typography','check_color_literals','check_l10n_parity','verify_pinned_actions','verify_signing_configuration','verify_node_dependency_alignment']:
            commands.append(['node','scripts/'+name+'.mjs'])
          commands += [['dart','run','tool/verify_version_consistency.dart'],['node','--test','scripts/verify_android_signing_certificate.test.mjs'],['flutter','analyze','--fatal-infos']]
          failed=False
          for command in commands:
            print('\nCHECK: '+' '.join(command),flush=True)
            result=subprocess.run(command)
            print('EXIT: '+str(result.returncode),flush=True)
            failed |= result.returncode != 0
          raise SystemExit(1 if failed else 0)
          PY
      - name: Verify repository and purchase regression suites
        if: success() || failure()
        run: flutter test test/shared/repositories test/core/payments > /tmp/repaired-tests.log 2>&1
      - name: Persist focused verification results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          chunks=['Source commit: '+subprocess.check_output(['git','rev-parse','HEAD'],text=True)]
          for path in ['/tmp/gates.log','/tmp/repaired-tests.log']:
            p=Path(path)
            if p.exists(): chunks += ['\n'+path+'\n'+p.read_text()[-30000:]]
          Path('docs/CI_REPAIR_DIAGNOSTICS.txt').write_text('\n'.join(chunks))
          PY
          git config user.name 'Notion AI'
          git config user.email 'noreply@notion.so'
          git add docs/CI_REPAIR_DIAGNOSTICS.txt
          git diff --cached --quiet || git commit -m 'chore: record complete static gate and regression results'
          git push origin HEAD:fix/review-priority-hardening-20260905
