name: Finalize Migration Binding (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/finalize-migration-binding.yml']

concurrency:
  group: finalize-migration-binding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/translator/package-lock.json
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Apply final cleanup and restore intentional lockfile
        run: |
          python3 scripts/finalize_migration_binding.py
          git checkout origin/main -- pubspec.lock
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions/translator
          flutter pub get
      - name: Verify complete affected surface
        run: |
          set +e
          : > /tmp/finalize-migration.log
          dart format --output=none --set-exit-if-changed . >> /tmp/finalize-migration.log 2>&1
          format_status=$?
          node scripts/check_file_length.mjs >> /tmp/finalize-migration.log 2>&1
          length_status=$?
          node --check scripts/check_premium_content_permissions.mjs >> /tmp/finalize-migration.log 2>&1
          syntax_status=$?
          npm run test:backend >> /tmp/finalize-migration.log 2>&1
          backend_status=$?
          flutter analyze --fatal-infos >> /tmp/finalize-migration.log 2>&1
          analyze_status=$?
          printf 'format=%s length=%s syntax=%s backend=%s analyze=%s\n' \
            "$format_status" "$length_status" "$syntax_status" "$backend_status" "$analyze_status" \
            >> /tmp/finalize-migration.log
          if [ "$format_status" -eq 0 ] && [ "$length_status" -eq 0 ] && \
             [ "$syntax_status" -eq 0 ] && [ "$backend_status" -eq 0 ] && \
             [ "$analyze_status" -eq 0 ]; then
            echo 0 > /tmp/finalize-migration.status
          else
            echo 1 > /tmp/finalize-migration.status
          fi
          exit 0
      - name: Commit verified cleanup
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(cat /tmp/finalize-migration.status)
          git checkout origin/main -- pubspec.lock
          if [ "$status" -eq 0 ]; then
            rm -f .ci-finalize-migration-diagnostics.txt
          else
            cp /tmp/finalize-migration.log .ci-finalize-migration-diagnostics.txt
          fi
          rm -f \
            .github/workflows/finalize-migration-binding.yml \
            scripts/finalize_migration_binding.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(security): finalize migration release binding'
          git push origin "HEAD:$BRANCH"
          exit "$status"
