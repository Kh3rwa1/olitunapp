name: Temporary Dart Formatter

on:
  push:
    branches:
      - codex/production-hardening-no-translator

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/production-hardening-no-translator
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/api/appwrite_db_service.dart \
            lib/core/config/appwrite_config.dart \
            lib/core/observability/crash_reporting.dart \
            lib/core/offline/mutation_outbox_service.dart \
            test/core/config/appwrite_config_test.dart \
            test/core/observability/crash_reporting_test.dart \
            test/core/offline/mutation_outbox_regression_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Dart files were already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/api/appwrite_db_service.dart \
            lib/core/config/appwrite_config.dart \
            lib/core/observability/crash_reporting.dart \
            lib/core/offline/mutation_outbox_service.dart \
            test/core/config/appwrite_config_test.dart \
            test/core/observability/crash_reporting_test.dart \
            test/core/offline/mutation_outbox_regression_test.dart
          git commit -m "style: apply Dart formatter"
          git push origin HEAD:codex/production-hardening-no-translator
