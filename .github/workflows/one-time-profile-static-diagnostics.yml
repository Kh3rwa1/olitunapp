name: One-time profile static diagnostics

on:
  push:
    branches:
      - fix/profile-avatar-production-quality
    paths:
      - .github/workflows/one-time-profile-static-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Collect exact static-gate diagnostics
        shell: bash
        run: |
          set +e
          flutter pub get > ci-profile-avatar-diagnostics.txt 2>&1
          run_step() {
            label="$1"
            shift
            {
              echo
              echo "===== $label ====="
              "$@"
              status=$?
              echo "===== exit $status ====="
            } >> ci-profile-avatar-diagnostics.txt 2>&1
          }
          run_step git-status git status --short
          run_step format dart format --output=none --set-exit-if-changed .
          run_step file-length node scripts/check_file_length.mjs
          run_step typography node scripts/check_typography.mjs
          run_step color-tokens node scripts/check_color_literals.mjs
          run_step localization node scripts/check_l10n_parity.mjs
          run_step version dart run tool/verify_version_consistency.dart
          run_step action-pins node scripts/verify_pinned_actions.mjs
          run_step signing-config node scripts/verify_signing_configuration.mjs
          run_step node-alignment node scripts/verify_node_dependency_alignment.mjs
          run_step certificate-normalizer node --test scripts/verify_android_signing_certificate.test.mjs
          run_step release-gate-tests node --test scripts/check_release_gate.test.mjs
          run_step analyzer flutter analyze --fatal-infos
          cat ci-profile-avatar-diagnostics.txt
      - name: Commit diagnostic report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-profile-avatar-diagnostics.txt
          git commit -m 'ci: record exact profile static diagnostics'
          git push
