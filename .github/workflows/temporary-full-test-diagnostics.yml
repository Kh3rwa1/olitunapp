name: Temporary Full Test Diagnostics

on:
  push:
    branches:
      - codex/production-hardening-no-translator

permissions:
  contents: write

jobs:
  diagnose-full-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/production-hardening-no-translator
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Capture failing test groups
        run: |
          set +e
          flutter pub get > /tmp/pub-get.txt 2>&1
          flutter test --coverage --concurrency=4 > /tmp/full-tests.txt 2>&1
          test_status=$?
          {
            echo "## Full Flutter tests"
            echo "exit=$test_status"
            awk '
              /::group::❌/ { capture = 1 }
              capture { print }
              capture && /::endgroup::/ { capture = 0; print "" }
            ' /tmp/full-tests.txt
            echo "## Summary"
            grep -E '::error::[0-9]+ tests passed|Some tests failed' /tmp/full-tests.txt || true
          } > ci-full-test-failures.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-full-test-failures.txt
          git commit -m "ci: record exact Flutter failures"
          git push origin HEAD:codex/production-hardening-no-translator
