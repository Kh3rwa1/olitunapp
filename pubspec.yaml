name: itun
description: Olitun - Premium Ol Chiki (Santali Script) Learning App
publish_to: 'none'
version: 1.1.1+19

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Local Storage
  shared_preferences: 2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  fl_chart: ^1.2.0

  # Audio & Video
  audioplayers: ^6.6.0
  lottie: ^3.3.1
  video_player: ^2.8.6



  # Auth
  appwrite: 21.1.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  file_picker: ^10.3.10
  http: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.8

  path_provider: ^2.1.5
  web: ^1.1.1
  fpdart: ^1.1.0
  connectivity_plus: ^7.1.1
  equatable: ^2.0.7
  flutter_markdown: ^0.7.3+1

  # Crash & error reporting
  sentry_flutter: ^8.10.0
  share_plus: ^12.0.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  razorpay_flutter: ^1.3.7
  crypto: ^3.0.6
  in_app_review: ^2.0.9
  url_launcher: ^6.3.2

  flutter_web_plugins:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

  just_audio_platform_interface: any
  video_player_platform_interface: any
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/



  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    - family: OlChiki
      fonts:
        - asset: fonts/OlChiki.ttf
