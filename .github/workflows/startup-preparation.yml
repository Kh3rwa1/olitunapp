name: One-time startup regression validation

on:
  push:
    branches: ['fix/resilient-startup-20260905']
    paths: ['.github/workflows/startup-preparation.yml']

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/resilient-startup-20260905' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/resilient-startup-20260905
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed files
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dart format lib/core/startup/startup_tasks.dart test/core/ads/ad_readiness_test.dart
      - name: Record focused tests and analysis
        run: |
          printf 'Startup validation source: %s\n' "$GITHUB_SHA" > docs/STARTUP_DIAGNOSTICS.txt
          flutter --version >> docs/STARTUP_DIAGNOSTICS.txt
          set +e
          flutter test test/core/startup test/core/ads/ad_readiness_test.dart test/core/ads/ad_state_test.dart test/core/ads/consent_fail_closed_test.dart --reporter expanded >> docs/STARTUP_DIAGNOSTICS.txt 2>&1
          TEST_EXIT=$?
          flutter analyze --fatal-infos >> docs/STARTUP_DIAGNOSTICS.txt 2>&1
          ANALYZE_EXIT=$?
          node scripts/check_color_literals.mjs >> docs/STARTUP_DIAGNOSTICS.txt 2>&1
          COLOR_EXIT=$?
          printf '\nFocused test exit: %s\nAnalysis exit: %s\nColor gate exit: %s\n' "$TEST_EXIT" "$ANALYZE_EXIT" "$COLOR_EXIT" >> docs/STARTUP_DIAGNOSTICS.txt
      - name: Save evidence and remove one-time automation
        run: |
          git rm .github/workflows/startup-preparation.yml
          git add lib/core/startup/startup_tasks.dart test/core/ads/ad_readiness_test.dart docs/STARTUP_DIAGNOSTICS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(startup): record focused Flutter regression and analysis results'
          git push origin HEAD:refs/heads/fix/resilient-startup-20260905
