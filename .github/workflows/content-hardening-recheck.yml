name: One-time content hardening recheck

on:
  push:
    branches: ['fix/premium-content-boundary-20260905']
    paths: ['.github/workflows/content-hardening-recheck.yml']

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'Kh3rwa1/olitunapp' && github.ref == 'refs/heads/fix/premium-content-boundary-20260905' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Remove the diagnosed redundant null argument
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/shared/security/premium_content_policy_test.dart')
          s = p.read_text()
          old = '          categoryUnlockMode: null,\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '', 1))
          PY
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Record focused validation without weakening gates
        run: |
          REPORT=docs/CONTENT_HARDENING_DIAGNOSTICS.txt
          printf 'Source before lint correction: %s\n' "$GITHUB_SHA" > "$REPORT"
          flutter --version >> "$REPORT"
          dart format test/shared/security/premium_content_policy_test.dart >> "$REPORT" 2>&1
          set +e
          timeout 7m flutter test test/shared/security test/features/lessons --reporter expanded >> "$REPORT" 2>&1
          TEST_EXIT=$?
          timeout 5m flutter analyze --fatal-infos >> "$REPORT" 2>&1
          ANALYZE_EXIT=$?
          node --test scripts/check_premium_content_permissions.test.mjs >> "$REPORT" 2>&1
          NODE_EXIT=$?
          printf '\nFocused test exit: %s\nAnalysis exit: %s\nNode test exit: %s\n' "$TEST_EXIT" "$ANALYZE_EXIT" "$NODE_EXIT" >> "$REPORT"
          printf 'TEST_EXIT=%s\nANALYZE_EXIT=%s\nNODE_EXIT=%s\n' "$TEST_EXIT" "$ANALYZE_EXIT" "$NODE_EXIT" >> "$GITHUB_ENV"
      - name: Save evidence and remove temporary validation workflow
        run: |
          git rm .github/workflows/content-hardening-recheck.yml
          git add test/shared/security/premium_content_policy_test.dart docs/CONTENT_HARDENING_DIAGNOSTICS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(content): clear analyzer warning and record focused recheck'
          git push origin HEAD:refs/heads/fix/premium-content-boundary-20260905
      - name: Require all checks to pass
        run: test "$TEST_EXIT" = 0 && test "$ANALYZE_EXIT" = 0 && test "$NODE_EXIT" = 0
