name: One-time main web diagnostics

on:
  push:
    branches:
      - fix/main-ci-after-leaderboard-animation
    paths:
      - .github/workflows/one-time-main-web-diagnostics.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Collect failed main Flutter run output
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 30); do
            status=$(gh run view 34547897302 --repo "$GITHUB_REPOSITORY" --json status --jq '.status' 2>/dev/null)
            echo "POLL_$attempt=$status"
            [ "$status" = "completed" ] && break
            sleep 20
          done
          {
            echo "COLLECTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "===== RUN DETAILS ====="
            gh run view 34547897302 --repo "$GITHUB_REPOSITORY" \
              --json databaseId,name,event,status,conclusion,url,jobs
            echo "===== FAILED LOGS ====="
            gh run view 34547897302 --repo "$GITHUB_REPOSITORY" --log-failed
          } > ci-main-web-diagnostics.txt 2>&1
          cat ci-main-web-diagnostics.txt
          exit 0
      - name: Commit web diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-main-web-diagnostics.txt
          git commit -m 'ci: record failed main web release output'
          git push
