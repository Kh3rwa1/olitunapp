# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    unnecessary_lambdas: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    avoid_redundant_argument_values: true

# custom_lint powers the riverpod_lint rules below. Keep its version in sync
# with the `custom_lint` dev dependency and always pin `riverpod_lint` to the
# same major as `flutter_riverpod` (both are currently 2.x). riverpod_lint
# does not run as part of `flutter analyze`; it runs via `dart run custom_lint`,
# which is also wired into CI (see .github/workflows/flutter-ci.yml).
#
# Every rule listed here exists in riverpod_lint 2.6.x (see
# riverpod_lint/lib/riverpod_lint.dart). custom_lint silently ignores unknown
# rule names, so only add names that the installed version actually ships.
#
# KNOWN LIMITATION: riverpod_lint 2.6.x pins analyzer ^7, which cannot parse
# the dot-shorthand syntax used by the current Flutter SDK; with the
# `analyzer: plugins: [custom_lint]` entry enabled the plugin crashes
# (`Missing implementation of visitDotShorthandPropertyAccess`) and hangs,
# and the legacy-plugin entry itself fails `flutter analyze --fatal-infos`.
# The entry is therefore omitted, so `dart run custom_lint` currently checks
# nothing. Re-enable it once the app moves to riverpod 3 / riverpod_lint 3
# (analysis_server_plugin based).
custom_lint:
  enable_all_lint_rules: false
  rules:
    - async_value_nullable_pattern
    - avoid_build_context_in_providers
    - avoid_manual_providers_as_generated_provider_dependency
    - avoid_public_notifier_properties
    - avoid_ref_inside_state_dispose
    - functional_ref
    - missing_provider_scope
    - notifier_build
    - notifier_extends
    - protected_notifier_properties
    - provider_dependencies
    - provider_parameters
    - scoped_providers_should_specify_dependencies
    - unsupported_provider_value

analyzer:
  exclude:
    - "flutter/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
  errors:
    avoid_print: warning
    deprecated_member_use_from_same_package: ignore

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
