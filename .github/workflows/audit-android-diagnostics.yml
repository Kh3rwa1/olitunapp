name: Audit Android Failure Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  pull-requests: write

jobs:
  inspect-failure:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/audit-restore-startup-release-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
      - name: Read complete disposal stacks without deployment secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module - <<'JS'
          const base = ['https:', '', 'api.github.com', 'repos', process.env.GITHUB_REPOSITORY].join('/');
          const headers = {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json'};
          const response = await fetch(`${base}/actions/jobs/101412833904/logs`, {headers});
          if (!response.ok) throw new Error(`Job log HTTP ${response.status}`);
          const lines = (await response.text()).replace(/\x1b\[[0-9;]*m/g, '').split('\n').map(line => line.replace(/^\S+Z\s+/, ''));
          const stacks = new Set();
          for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('ProviderContainer that was already disposed')) {
              const block = lines.slice(Math.max(0, i-2), i+24).join('\n');
              stacks.add(block);
              if (stacks.size >= 5) break;
            }
          }
          const excerpt = [...stacks].join('\n\n---\n\n').slice(0, 24000).replace(/Bearer\s+\S+/gi, 'Bearer [REDACTED]');
          const body = `## Android provider-disposal stacks\nSource: failed job 101412833904 on d4dc6b6.\n\n\`\`\`text\n${excerpt || '(No matching stack)'}\n\`\`\``;
          const posted = await fetch(`${base}/issues/${process.env.PR_NUMBER}/comments`, {method:'POST', headers:{...headers, 'Content-Type':'application/json'}, body:JSON.stringify({body})});
          if (!posted.ok) throw new Error(`Diagnostic comment HTTP ${posted.status}`);
          JS
