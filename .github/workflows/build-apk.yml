name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677 # v5.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_ALIAS" ]; then
            cat <<EOF > android/key.properties
            storePassword=$ANDROID_STORE_PASSWORD
            keyPassword=$ANDROID_KEY_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            storeFile=upload-keystore.jks
            EOF
          fi

      - name: Build APK (Release)
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          TRANSLATE_URL: ${{ secrets.TRANSLATE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENV: production
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          if [ -z "$ANDROID_EXPECTED_CERT_SHA256" ]; then
            echo "::error::ANDROID_EXPECTED_CERT_SHA256 secret is required for production release APK verification"
            exit 1
          fi
          flutter build apk --release \
            --dart-define=APPWRITE_ENDPOINT="$APPWRITE_ENDPOINT" \
            --dart-define=APPWRITE_PROJECT_ID="$APPWRITE_PROJECT_ID" \
            --dart-define=TRANSLATE_URL="$TRANSLATE_URL" \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=SENTRY_ENV="${SENTRY_ENV:-production}"
          bash scripts/verify_android_signing_certificate.sh build/app/outputs/flutter-apk/app-release.apk "$ANDROID_EXPECTED_CERT_SHA256"
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Cleanup Signing Material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
