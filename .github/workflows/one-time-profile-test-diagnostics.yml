name: One-time profile test diagnostics

on:
  push:
    branches:
      - fix/profile-avatar-production-quality
    paths:
      - .github/workflows/one-time-profile-test-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Run complete profile tests
        shell: bash
        run: |
          set +e
          flutter pub get > ci-profile-test-diagnostics.txt 2>&1
          flutter test --reporter expanded \
            test/features/profile \
            test/core/reviews/review_service_test.dart \
            >> ci-profile-test-diagnostics.txt 2>&1
          status=$?
          echo "PROFILE_TEST_EXIT=$status" >> ci-profile-test-diagnostics.txt
          cat ci-profile-test-diagnostics.txt
          exit 0
      - name: Commit diagnostic report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-profile-test-diagnostics.txt
          git commit -m 'ci: record complete profile test diagnostics'
          git push
