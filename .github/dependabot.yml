version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"
    groups:
      flutter-ui:
        patterns:
          - "flutter_animate"
          - "flutter_svg"
          - "cached_network_image"
          - "fl_chart"
          - "shimmer"
          - "lottie"
      flutter-storage:
        patterns:
          - "hive*"
          - "shared_preferences"
    # NOTE: Appwrite Sites only offers the flutter-3.35 build runtime
    # (Dart 3.9.2). These versions require a newer SDK and fail every
    # Appwrite preview deployment, so ignore them until Appwrite ships a
    # newer Flutter build runtime. Mirrors the caps in pubspec.yaml.
    ignore:
      - dependency-name: "lottie"
        versions: [">=3.4.0"]
      - dependency-name: "image_picker"
        versions: [">=1.2.3"]
      - dependency-name: "google_mobile_ads"
        versions: [">=8"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"

  - package-ecosystem: "npm"
    directories:
      - "/cloudflare/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cloudflare-worker"
