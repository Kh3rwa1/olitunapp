name: Audit CI Failure Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect-failure:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/reliability-readiness-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
      - name: Locate content list consumers without executing app code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const matches = execFileSync('git', ['grep', '-n', '-B', '5', '-A', '8', 'contentListProvider', '--', 'lib'], {encoding:'utf8'});
          const base = ['https:', '', 'api.github.com', 'repos', process.env.GITHUB_REPOSITORY].join('/');
          const headers = {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type':'application/json'};
          const body = `## Content-list consumer inventory\nRead-only source search for the Chrome failure. No application code executed.\n\n\`\`\`text\n${matches.slice(0, 52000)}\n\`\`\``;
          const posted = await fetch(`${base}/issues/${process.env.PR_NUMBER}/comments`, {method:'POST', headers, body:JSON.stringify({body})});
          if (!posted.ok) throw new Error(`Diagnostic comment HTTP ${posted.status}`);
          JS
