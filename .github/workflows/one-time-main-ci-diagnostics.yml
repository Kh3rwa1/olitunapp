name: One-time main CI repair

on:
  push:
    branches:
      - fix/main-ci-after-profile-cleanup
    paths:
      - .github/workflows/one-time-main-ci-diagnostics.yml

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '34511637243'
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Rerun transient Release Please failure
        shell: bash
        run: |
          set +e
          {
            echo "RUN_ID=$FAILED_RUN_ID"
            echo "REQUESTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID/rerun-failed-jobs" 2>&1)
            request_status=$?
            echo "RERUN_REQUEST_EXIT=$request_status"
            if [ -n "$response" ]; then
              echo "$response"
            fi

            if [ "$request_status" -eq 0 ]; then
              for attempt in $(seq 1 48); do
                run_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID" \
                  --jq '[.run_attempt, .status, (.conclusion // "")] | @tsv' 2>&1)
                echo "POLL_$attempt=$run_state"
                status=$(printf '%s' "$run_state" | cut -f2)
                if [ "$status" = "completed" ]; then
                  break
                fi
                sleep 10
              done
            fi
          } > ci-main-rerun.txt
          cat ci-main-rerun.txt
          exit 0
      - name: Commit rerun report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-main-rerun.txt
          git commit -m 'ci: record main Release Please rerun'
          git push
