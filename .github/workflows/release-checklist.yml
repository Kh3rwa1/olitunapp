name: Release Checklist

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.9+15)'
        required: true
      deploy_web:
        description: 'Deploy web to production'
        type: boolean
        default: true

permissions:
  contents: write

env:
  APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
  TRANSLATE_URL: ${{ secrets.TRANSLATE_URL }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}

jobs:
  # Phase 1: Validate environment
  env-validation:
    name: "1. Environment Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check required secrets
        run: |
          MISSING=""
          [ -z "$APPWRITE_ENDPOINT" ] && MISSING="$MISSING APPWRITE_ENDPOINT"
          [ -z "$APPWRITE_PROJECT_ID" ] && MISSING="$MISSING APPWRITE_PROJECT_ID"
          [ -z "$TRANSLATE_URL" ] && MISSING="$MISSING TRANSLATE_URL"
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEY_ALIAS" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$ANDROID_KEY_PASSWORD" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          [ -z "$ANDROID_STORE_PASSWORD" ] && MISSING="$MISSING ANDROID_STORE_PASSWORD"
          [ -z "$ANDROID_EXPECTED_CERT_SHA256" ] && MISSING="$MISSING ANDROID_EXPECTED_CERT_SHA256"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required environment variables are set."

      - name: Validate version format & consistency
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION. Expected: X.Y.Z+BUILD"
            exit 1
          fi
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Input release version ($VERSION) does not match tested pubspec.yaml version ($PUBSPEC_VERSION). Update pubspec.yaml in a tested commit before running release tagging."
            exit 1
          fi
          echo "✅ Version format and consistency verified: $VERSION"

  # Phase 2: Build + Tests
  build-test:
    name: "2. Build & Test"
    runs-on: ubuntu-latest
    needs: env-validation
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Verify Version Consistency
        run: dart run tool/verify_version_consistency.dart

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: |
          dart run tool/enforce_coverage.dart \
            --min=65 \
            --path-min=/data/:40 \
            --path-min=/domain/:70 \
            --path-min=/core/auth/:50 \
            --enforce-after=2026-06-21

      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=APPWRITE_ENDPOINT="$APPWRITE_ENDPOINT" \
            --dart-define=APPWRITE_PROJECT_ID="$APPWRITE_PROJECT_ID" \
            --dart-define=TRANSLATE_URL="$TRANSLATE_URL"
          node scripts/patch_service_worker.mjs
          node scripts/verify_service_worker_patch.mjs

      - name: Check Web performance budget
        run: dart run tool/check_size_budget.dart --path=build/web --budget-key=webBuildBytes --baseline=tool/performance_budgets.json --max-growth=5

      - name: Configure Android signing
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define=APPWRITE_ENDPOINT="$APPWRITE_ENDPOINT" \
            --dart-define=APPWRITE_PROJECT_ID="$APPWRITE_PROJECT_ID" \
            --dart-define=TRANSLATE_URL="$TRANSLATE_URL"
          bash scripts/verify_android_signing_certificate.sh build/app/outputs/flutter-apk/app-release.apk "$ANDROID_EXPECTED_CERT_SHA256"
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Cleanup Signing Material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Check APK performance budget
        run: dart run tool/check_size_budget.dart --path=build/app/outputs/flutter-apk/app-release.apk --budget-key=apkReleaseBytes --baseline=tool/performance_budgets.json --max-growth=5

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: release-${{ github.event.inputs.version }}
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Phase 3: Smoke deploy (web)
  smoke-deploy:
    name: "3. Smoke Deploy"
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event.inputs.deploy_web == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Download build artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4.1.8
        with:
          name: release-${{ github.event.inputs.version }}
          path: build/

      - name: Verify web build artifacts exist
        run: |
          if [ ! -f "build/web/index.html" ]; then
            echo "::error::Web build artifacts missing — build/web/index.html not found"
            exit 1
          fi
          FILE_COUNT=$(find build/web -type f | wc -l)
          echo "✅ Web build verified: $FILE_COUNT files"

      - name: Verify APK exists
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "::warning::APK not found in artifacts — Android build may have been skipped"
          else
            APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
            echo "✅ APK verified: $APK_SIZE"
          fi

  # Phase 4: Tag release
  tag-release:
    name: "4. Tag Release"
    runs-on: ubuntu-latest
    needs: [env-validation, build-test, smoke-deploy]
    if: |
      always() &&
      needs.env-validation.result == 'success' &&
      needs.build-test.result == 'success' &&
      (github.event.inputs.deploy_web != 'true' || needs.smoke-deploy.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Tag release on verified commit
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          echo "✅ Successfully tagged verified commit $GITHUB_SHA as v$VERSION"

      - name: Generate release summary
        run: |
          echo "## Release ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ✅ Validated |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ✅ ≥65% |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Build | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Build | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ✅ v${{ github.event.inputs.version }} |" >> $GITHUB_STEP_SUMMARY
