name: Capture Flutter Unit Logs (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/capture-flutter-unit-logs.yml']

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Download failed job log
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '104653780904'
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB_ID/logs" \
            --output /tmp/flutter-unit-job.log
          if file /tmp/flutter-unit-job.log | grep -qi zip; then
            unzip -p /tmp/flutter-unit-job.log > /tmp/flutter-unit-job.txt
          else
            cp /tmp/flutter-unit-job.log /tmp/flutter-unit-job.txt
          fi
          tail -n 2500 /tmp/flutter-unit-job.txt > .ci-flutter-unit-diagnostics.txt
      - name: Commit diagnostics and remove temporary workflow
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-flutter-unit-logs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(ci): capture Flutter unit failure'
          git push origin "HEAD:$BRANCH"
