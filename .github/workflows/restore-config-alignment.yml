name: Restore config alignment (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/resumable-restore-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Align deployment declarations and dynamic runtime key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('functions/admin-maintenance/src/main.js')
          s = p.read_text()
          for old, new in [
            ('export function requireConfig(env = process.env) {', 'export function requireConfig(env = process.env, runtimeApiKey) {'),
            ('const apiKey = env.APPWRITE_FUNCTION_API_KEY || env.APPWRITE_API_KEY;', 'const apiKey = runtimeApiKey || env.APPWRITE_FUNCTION_API_KEY || env.APPWRITE_API_KEY;'),
            ('const { endpoint, projectId, apiKey } = requireConfig();', "const { endpoint, projectId, apiKey } = requireConfig(process.env, req.headers['x-appwrite-key']);")
          ]:
            if old in s:
              assert s.count(old) == 1
              s = s.replace(old, new)
          p.write_text(s)
          p = Path('appwrite.config.json')
          raw = p.read_text()
          config = json.loads(raw)
          entries = [f for f in config['functions'] if f.get('$id') == 'admin-maintenance']
          assert len(entries) == 1
          for scope in ['documents.read', 'documents.write', 'files.read']:
            if scope not in entries[0]['scopes']:
              entries[0]['scopes'].append(scope)
          p.write_text(json.dumps(config, indent=2) + '\n')
          PY
          npm ci --prefix functions/admin-maintenance --ignore-scripts
          node --check functions/admin-maintenance/src/main.js
          node --test functions/test/resumable_restore.test.js functions/test/admin_restore_runtime.test.js functions/test/admin_restore_sdk_contract.test.js > /tmp/alignment-tests.log
      - name: Save and report reviewed changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git add functions/admin-maintenance/src/main.js appwrite.config.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(admin): accept runtime key and align restore scope declarations'
            gh auth setup-git
            git push origin HEAD:refs/heads/fix/resumable-restore-20260906
          fi
          { echo '## Restore deployment alignment'; echo "Head: $(git rev-parse HEAD)"; echo '```text'; tail -n 15 /tmp/alignment-tests.log; echo '```'; } > /tmp/alignment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/alignment.md
