name: One-time Appwrite manifest mirror sync

on:
  push:
    branches:
      - fix/sync-appwrite-runtime-config-20260910
    paths:
      - .github/workflows/one-time-sync-appwrite-mirror.yml

permissions:
  contents: write

jobs:
  sync-manifest-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Synchronize the compatibility manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          canonical_path = Path('appwrite.json')
          mirror_path = Path('appwrite.config.json')
          canonical = json.loads(canonical_path.read_text(encoding='utf-8'))
          mirror = json.loads(mirror_path.read_text(encoding='utf-8'))

          def translator(functions):
              return next(item for item in functions if item.get('$id') == '6a007db60024418c0997')

          if translator(canonical['functions']) != translator(mirror['functions']):
              raise SystemExit('Translator configurations differ before synchronization')

          mirror['functions'] = canonical['functions']
          mirror_path.write_text(
              json.dumps(mirror, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit synchronized compatibility manifest
        shell: bash
        run: |
          if git diff --quiet -- appwrite.config.json; then
            echo 'appwrite.config.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appwrite.config.json
          git commit -m 'chore: sync Appwrite compatibility manifest'
          git push origin HEAD:${GITHUB_REF_NAME}
