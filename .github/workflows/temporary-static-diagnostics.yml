name: Temporary Static Diagnostics

on:
  push:
    branches:
      - codex/production-hardening-no-translator

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/production-hardening-no-translator
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Capture diagnostics
        run: |
          set +e
          : > ci-static-diagnostics.log
          run_check() {
            label="$1"
            shift
            echo "## $label" >> ci-static-diagnostics.log
            "$@" >> ci-static-diagnostics.log 2>&1
            echo "exit=$?" >> ci-static-diagnostics.log
            echo >> ci-static-diagnostics.log
          }
          run_check "pub get" flutter pub get
          run_check "format" dart format --output=none --set-exit-if-changed .
          run_check "file length" node scripts/check_file_length.mjs
          run_check "typography" node scripts/check_typography.mjs
          run_check "colors" node scripts/check_color_literals.mjs
          run_check "localization" node scripts/check_l10n_parity.mjs
          run_check "version" dart run tool/verify_version_consistency.dart
          run_check "action pins" node scripts/verify_pinned_actions.mjs
          run_check "signing" node scripts/verify_signing_configuration.mjs
          run_check "node dependency policy" node scripts/verify_node_dependency_alignment.mjs
          run_check "certificate normalizer" node --test scripts/verify_android_signing_certificate.test.mjs
          run_check "release gate tests" node --test scripts/check_release_gate.test.mjs
          run_check "analyze" flutter analyze --fatal-infos
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-static-diagnostics.log
          git commit -m "ci: record static-analysis diagnostics"
          git push origin HEAD:codex/production-hardening-no-translator
