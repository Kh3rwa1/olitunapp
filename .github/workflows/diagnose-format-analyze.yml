name: Diagnose Format and Analyze (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/diagnose-format-analyze.yml']

concurrency:
  group: diagnose-format-analyze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reproduce every canonical static-analysis step
        run: |
          set +e
          : > /tmp/diagnose.log
          run_step() {
            name="$1"
            shift
            echo "===== $name =====" >> /tmp/diagnose.log
            "$@" >> /tmp/diagnose.log 2>&1
            code=$?
            echo "status=$code" >> /tmp/diagnose.log
            return 0
          }
          run_step format dart format --output=none --set-exit-if-changed .
          run_step file_length node scripts/check_file_length.mjs
          run_step typography node scripts/check_typography.mjs
          run_step colors node scripts/check_color_literals.mjs
          run_step sheets node scripts/check_sheets_above_nav.mjs
          run_step l10n node scripts/check_l10n_parity.mjs
          run_step review_ids node scripts/check_review_corpus_ids.mjs
          run_step review_tests node --test scripts/check_review_corpus_ids.test.mjs
          run_step version dart run tool/verify_version_consistency.dart
          run_step pinned_actions node scripts/verify_pinned_actions.mjs
          run_step signing node scripts/verify_signing_configuration.mjs
          run_step node_alignment node scripts/verify_node_dependency_alignment.mjs
          run_step certificate_tests node --test scripts/verify_android_signing_certificate.test.mjs
          run_step release_tests node --test scripts/check_release_gate.test.mjs
          run_step analyze flutter analyze --fatal-infos
          cp /tmp/diagnose.log .ci-format-analyze-diagnostics.txt
      - name: Commit diagnostics and remove temporary workflow
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-format-analyze.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(ci): capture static-analysis diagnostics'
          git push origin "HEAD:$BRANCH"
