name: Retry Static and CodeQL Correction (Temporary)

on:
  push:
    branches: ['hardening/secure-premium-listing-20260916']
    paths: ['.github/workflows/retry-static-codeql.yml']

concurrency:
  group: retry-static-codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/translator/package-lock.json
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Apply corrections with diagnostics
        run: |
          set +e
          python3 scripts/repair_static_patch.py > /tmp/static-patch.log 2>&1
          repair_status=$?
          if [ "$repair_status" -eq 0 ]; then
            python3 scripts/patch_static_codeql.py >> /tmp/static-patch.log 2>&1
            patch_status=$?
          else
            patch_status=1
          fi
          echo "$patch_status" > /tmp/static-patch.status
          exit 0
      - name: Install dependencies when patch succeeded
        if: ${{ hashFiles('/tmp/static-patch.status') == '' || always() }}
        run: |
          if [ "$(cat /tmp/static-patch.status)" -ne 0 ]; then exit 0; fi
          npm ci
          npm ci --prefix functions/translator
          flutter pub get
      - name: Verify corrected gates
        run: |
          set +e
          patch_status=$(cat /tmp/static-patch.status)
          : > /tmp/fix-static-codeql.log
          cat /tmp/static-patch.log >> /tmp/fix-static-codeql.log
          if [ "$patch_status" -eq 0 ]; then
            dart format --output=none --set-exit-if-changed . >> /tmp/fix-static-codeql.log 2>&1
            format_status=$?
            node scripts/check_file_length.mjs >> /tmp/fix-static-codeql.log 2>&1
            length_status=$?
            node --check scripts/check_premium_content_permissions.mjs >> /tmp/fix-static-codeql.log 2>&1
            syntax_status=$?
            npm run test:backend >> /tmp/fix-static-codeql.log 2>&1
            backend_status=$?
            flutter analyze --fatal-infos >> /tmp/fix-static-codeql.log 2>&1
            analyze_status=$?
          else
            format_status=1; length_status=1; syntax_status=1; backend_status=1; analyze_status=1
          fi
          printf 'patch=%s format=%s length=%s syntax=%s backend=%s analyze=%s\n' \
            "$patch_status" "$format_status" "$length_status" "$syntax_status" "$backend_status" "$analyze_status" \
            >> /tmp/fix-static-codeql.log
          if [ "$patch_status" -eq 0 ] && [ "$format_status" -eq 0 ] && \
             [ "$length_status" -eq 0 ] && [ "$syntax_status" -eq 0 ] && \
             [ "$backend_status" -eq 0 ] && [ "$analyze_status" -eq 0 ]; then
            echo 0 > /tmp/fix-static-codeql.status
          else
            echo 1 > /tmp/fix-static-codeql.status
          fi
          exit 0
      - name: Commit result and clean temporary files
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(cat /tmp/fix-static-codeql.status)
          if [ "$status" -eq 0 ]; then
            rm -f .ci-format-analyze-diagnostics.txt .ci-static-codeql-diagnostics.txt
          else
            git reset --hard HEAD
            cp /tmp/fix-static-codeql.log .ci-static-codeql-diagnostics.txt
          fi
          rm -f \
            .github/workflows/fix-static-codeql.yml \
            .github/workflows/retry-static-codeql.yml \
            scripts/patch_static_codeql.py \
            scripts/repair_static_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(security): validate migration I/O boundaries'
          git push origin "HEAD:$BRANCH"
          exit "$status"
