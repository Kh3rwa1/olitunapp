name: One-time cancelled main run diagnostics

on:
  push:
    branches:
      - fix/sync-appwrite-runtime-config-20260910
    paths:
      - .github/workflows/one-time-main-status-diagnostics.yml

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Inspect cancelled main run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RUN_ID='34455909511'
          gh api "repos/$REPO/actions/runs/$RUN_ID" > /tmp/run.json
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          {
            echo '# Cancelled main run diagnostics'
            jq -r '"- id: \(.id)\n- name: \(.name)\n- path: \(.path)\n- event: \(.event)\n- head branch: \(.head_branch)\n- head SHA: \(.head_sha)\n- status: \(.status)\n- conclusion: \(.conclusion)\n- run attempt: \(.run_attempt)\n- created: \(.created_at)\n- updated: \(.updated_at)\n- actor: \(.actor.login)\n- triggering actor: \(.triggering_actor.login)\n- URL: \(.html_url)"' /tmp/run.json
            echo
            echo '## Jobs'
            jq -r '.jobs[] | "- \(.name): status=\(.status), conclusion=\(.conclusion // "pending")"' /tmp/jobs.json
          } > ci-cancelled-main-run.md

      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-cancelled-main-run.md
          git commit -m 'ci: record cancelled main run details'
          git push origin HEAD:${GITHUB_REF_NAME}
