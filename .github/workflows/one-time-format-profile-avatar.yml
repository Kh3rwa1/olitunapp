name: One-time profile avatar formatter

on:
  push:
    branches:
      - fix/profile-avatar-production-quality
    paths:
      - .github/workflows/one-time-format-profile-avatar.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Format changed Dart sources and tests
        run: |
          dart format \
            lib/features/profile/domain/entities/profile_avatar.dart \
            lib/features/profile/presentation/progress_screen.dart \
            lib/features/profile/presentation/providers/profile_account_providers.dart \
            lib/features/profile/presentation/widgets/profile_avatar_picker_sheet.dart \
            lib/features/profile/presentation/widgets/profile_hero_card.dart \
            lib/features/profile/presentation/widgets/live_achievements_section.dart \
            test/features/profile/profile_avatar_test.dart \
            test/features/profile/profile_avatar_picker_sheet_test.dart \
            test/features/profile/live_achievements_section_test.dart \
            test/core/reviews/review_service_test.dart
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/profile test/features/profile test/core/reviews
          git commit -m 'style(profile): apply Dart formatting'
          git push
