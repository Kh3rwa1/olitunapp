name: Flutter CI

on:
  push:
    branches: [ main, 'hardening/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-analyze:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos

  flutter-unit-widget-tests:
    name: Flutter Unit, Widget & Coverage Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Flutter tests with coverage
        run: flutter test --coverage --concurrency=4
      - name: Enforce coverage threshold
        run: |
          dart run tool/enforce_coverage.dart \
            --min=65 \
            --path-min=/data/:35 \
            --path-min=/domain/:65 \
            --enforce-after=2026-06-21
      - name: Smoke tests
        run: flutter test test/smoke
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  node-backend-tests:
    name: Node Serverless Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - name: Run backend payment & deletion Node tests
        run: |
          node --test functions/test/payment_functions.test.js
          node --test functions/test/delete_account.test.js
          node --test functions/aggregateLearningAnalytics/test/main.test.js
          node --test functions/translator/test/security.test.js
          node --test functions/backupCollections/test/main.test.js
          node --test functions/cleanupAnalyticsEvents/test/main.test.js
          node --test functions/admin-maintenance/test/main.test.js

  permission-and-schema-tests:
    name: Appwrite Permission Invariants & Schema Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Appwrite permission invariant unit tests
        run: flutter test test/core/api/appwrite_permission_invariants_test.dart
      - name: Run staging permission integration test (dry-run)
        run: node scripts/staging_permission_test.mjs
      - name: Run service worker patch unit tests
        run: node scripts/patch_service_worker.test.mjs
      - name: Detect Appwrite schema drift
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "⚠️ SKIPPED: APPWRITE_API_KEY secret is not configured in repository secrets."
            exit 0
          fi
          node scripts/snapshot_appwrite_schema.mjs
          if ! git diff --exit-code test/fixtures/schema/; then
            echo "❌ FAIL: Appwrite schema drift detected!"
            git --no-pager diff -- test/fixtures/schema/
            exit 1
          fi

  web-release-build:
    name: Web Release Build & Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Load performance budgets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          git show "origin/$BASE_REF:tool/performance_budgets.json" > /tmp/base_performance_budgets.json || cp tool/performance_budgets.json /tmp/base_performance_budgets.json
      - name: Build Web Release
        run: |
          BUILD_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release \
            --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 \
            --dart-define=APPWRITE_PROJECT_ID=ci \
            --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions \
            --dart-define=BUILD_SHA=$BUILD_SHA \
            --dart-define=BUILT_AT=$BUILT_AT
          
          mkdir -p build/web
          echo "{\"sha\": \"$BUILD_SHA\", \"builtAt\": \"$BUILT_AT\"}" > build/web/build-info.json
          
          node scripts/patch_service_worker.mjs
          node scripts/verify_service_worker_patch.mjs
      - name: Check Web performance budget
        run: dart run tool/check_size_budget.dart --path=build/web --budget-key=webBuildBytes --baseline=/tmp/base_performance_budgets.json --max-growth=5
      - name: Upload Web Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-build
          path: build/web/
          retention-days: 14

  android-release-build:
    name: Android APK Release Build & Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Load performance budgets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          git show "origin/$BASE_REF:tool/performance_budgets.json" > /tmp/base_performance_budgets.json || cp tool/performance_budgets.json /tmp/base_performance_budgets.json
      - name: Build Android Release APK
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: |
          flutter build apk --release \
            --dart-define=APPWRITE_ENDPOINT=https://example.com/v1 \
            --dart-define=APPWRITE_PROJECT_ID=ci \
            --dart-define=TRANSLATE_URL=https://example.com/v1/functions/6a007db60024418c0997/executions
      - name: Check APK performance budget
        run: dart run tool/check_size_budget.dart --path=build/app/outputs/flutter-apk/app-release.apk --budget-key=apkReleaseBytes --baseline=/tmp/base_performance_budgets.json --max-growth=5
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
