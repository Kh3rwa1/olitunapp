name: Audit CI Failure Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  pull-requests: write

jobs:
  inspect-failure:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/reliability-readiness-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
      - name: Read failed Chrome log without deployment secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module - <<'JS'
          const base = ['https:', '', 'api.github.com', 'repos', process.env.GITHUB_REPOSITORY].join('/');
          const headers = {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json'};
          const response = await fetch(`${base}/actions/jobs/101418213455/logs`, {headers});
          if (!response.ok) throw new Error(`Job log HTTP ${response.status}`);
          const lines = (await response.text()).replace(/\x1b\[[0-9;]*m/g, '').split('\n').map(line => line.replace(/^\S+Z\s+/, ''));
          const excerpt = lines.slice(-240).join('\n').slice(-32000)
            .replace(/Bearer\s+\S+/gi, 'Bearer [REDACTED]')
            .replace(/((?:x-appwrite-key|authorization)\s*[:=]\s*)\S+/gi, '$1[REDACTED]')
            .replace(/([?&](?:token|key|secret|password)=)[^&\s]+/gi, '$1[REDACTED]');
          const body = `## Chrome integration failure log\nSource: failed job 101418213455 on b3cee9fd84ec. Read-only log retrieval; no application or deployment code executed.\n\n\`\`\`text\n${excerpt}\n\`\`\``;
          const posted = await fetch(`${base}/issues/${process.env.PR_NUMBER}/comments`, {method:'POST', headers:{...headers, 'Content-Type':'application/json'}, body:JSON.stringify({body})});
          if (!posted.ok) throw new Error(`Diagnostic comment HTTP ${posted.status}`);
          JS
