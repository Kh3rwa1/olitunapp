name: One-time CI diagnostics cleanup

on:
  push:
    branches:
      - fix/sync-appwrite-runtime-config-20260910
    paths:
      - .github/workflows/one-time-main-status-diagnostics.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Remove temporary diagnostics
        shell: bash
        run: |
          git rm --ignore-unmatch \
            .github/workflows/one-time-main-status-diagnostics.yml \
            .github/workflows/one-time-rerun-cancelled-main-check.yml \
            ci-main-status-diagnostics.md \
            ci-cancelled-main-run.md \
            ci-main-check-rerun-result.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove temporary status diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}
