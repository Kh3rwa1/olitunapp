name: Hardening Autofix (Temporary)

on:
  push:
    branches: ['hardening/production-readiness-20260916']
    paths: ['.github/workflows/hardening-autofix.yml']

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fix final analyzer issue and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/core/offline/mutation_outbox_regression_test.dart')
          text = path.read_text()
          old = '      final attempts = MutationOutboxService.maxRetryAttempts + 3;'
          new = '      const attempts = MutationOutboxService.maxRetryAttempts + 3;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one analyzer-fix anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format test/core/offline/mutation_outbox_regression_test.dart
          flutter analyze --fatal-infos
          flutter test \
            test/core/offline/mutation_outbox_regression_test.dart \
            test/shared/offline/content_mutation_replay_test.dart
          rm -f .ci-hardening-diagnostics.txt
      - name: Commit verified cleanup
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/core/offline/mutation_outbox_regression_test.dart
          git add -A .ci-hardening-diagnostics.txt
          git commit -m 'test: clear final outbox analyzer diagnostic'
          git push origin "HEAD:$BRANCH"
