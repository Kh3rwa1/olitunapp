name: Temporary Flutter Test Diagnostics

on:
  push:
    branches:
      - codex/production-hardening-no-translator

permissions:
  contents: write

jobs:
  diagnose-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/production-hardening-no-translator
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Capture test diagnostics
        run: |
          set +e
          flutter pub get > /tmp/pub-get.txt 2>&1
          flutter test \
            test/core/config/appwrite_config_test.dart \
            test/core/observability/crash_reporting_test.dart \
            test/core/offline/mutation_outbox_regression_test.dart \
            > /tmp/targeted-tests.txt 2>&1
          targeted_status=$?
          {
            echo "## Targeted tests"
            echo "exit=$targeted_status"
            tail -n 400 /tmp/targeted-tests.txt
          } > ci-flutter-test-diagnostics.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-flutter-test-diagnostics.txt
          git commit -m "ci: record Flutter test diagnostics"
          git push origin HEAD:codex/production-hardening-no-translator
