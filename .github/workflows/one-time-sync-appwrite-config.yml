name: One-time Appwrite runtime config sync

on:
  push:
    branches:
      - fix/sync-appwrite-runtime-config-20260910
    paths:
      - .github/workflows/one-time-sync-appwrite-config.yml

permissions:
  contents: write

jobs:
  sync-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apply verified live function settings
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('appwrite.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          functions = {item['$id']: item for item in config['functions']}
          translator_before = copy.deepcopy(functions['6a007db60024418c0997'])

          required = {
              'reconcileOrphanedDeletions', 'admin-maintenance',
              'manageAdminAccess', 'getUserMistakes',
              'markMistakeMastered', 'completeMistakeReview',
              'recordBakhedProgress', 'getUserGamificationSummary',
              'cleanupAnalyticsEvents', 'backupCollections',
              'reconcilePaymentAttempts', 'createRazorpayOrder',
              'razorpayWebhook', 'verifyCoursePurchase', 'bintiWaitlist',
          }
          missing = sorted(required - functions.keys())
          if missing:
              raise SystemExit(f'Missing function entries: {missing}')

          def add_scopes(function_id, *scopes):
              current = functions[function_id].setdefault('scopes', [])
              for scope in scopes:
                  if scope not in current:
                      current.append(scope)

          for function_id in (
              'markMistakeMastered', 'completeMistakeReview',
              'recordBakhedProgress', 'reconcilePaymentAttempts',
              'createRazorpayOrder', 'razorpayWebhook',
              'verifyCoursePurchase', 'bintiWaitlist',
          ):
              add_scopes(function_id, 'documents.read', 'documents.write')

          add_scopes('getUserMistakes', 'documents.read')
          add_scopes('getUserGamificationSummary', 'documents.read')
          add_scopes('backupCollections', 'documents.read')
          add_scopes('manageAdminAccess', 'documents.write')

          functions['reconcileOrphanedDeletions']['scopes'] = [
              scope for scope in functions['reconcileOrphanedDeletions']['scopes']
              if scope != 'users.write'
          ]
          functions['reconcileOrphanedDeletions']['timeout'] = 120
          functions['admin-maintenance']['timeout'] = 300
          functions['cleanupAnalyticsEvents']['timeout'] = 120
          functions['backupCollections']['timeout'] = 300

          if functions['6a007db60024418c0997'] != translator_before:
              raise SystemExit('Translator configuration changed unexpectedly')

          path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit synchronized configuration
        shell: bash
        run: |
          if git diff --quiet -- appwrite.json; then
            echo 'appwrite.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appwrite.json
          git commit -m 'chore: sync Appwrite function runtime config'
          git push origin HEAD:${GITHUB_REF_NAME}
