name: One-time profile leaderboard formatter

on:
  push:
    branches:
      - fix/profile-leaderboard-overflow-animation
    paths:
      - .github/workflows/one-time-profile-leaderboard-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/profile/presentation/widgets/profile_hero_card.dart \
            test/features/profile/profile_hero_card_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            lib/features/profile/presentation/widgets/profile_hero_card.dart \
            test/features/profile/profile_hero_card_test.dart; then
            echo 'Files were already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/profile/presentation/widgets/profile_hero_card.dart \
            test/features/profile/profile_hero_card_test.dart
          git commit -m 'style(profile): format leaderboard interaction'
          git push
