name: One-time hardening regression recheck

on:
  push:
    branches: ['fix/web-media-accessibility-20260905']
    paths: ['.github/workflows/hardening-validation.yml', 'scripts/prepare_hardening_validation.py']

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'Kh3rwa1/olitunapp' && github.ref == 'refs/heads/fix/web-media-accessibility-20260905' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - area: web
            branch: fix/web-media-accessibility-20260905
            expected: event
            tests: test/features/home/widgets/home_category_accessibility_test.dart test/features/home/home_screen_test.dart
          - area: progress
            branch: fix/progress-reset-sync-20260905
            expected: 2610e986c2139608d1dbb73ba715d3140e6f3cb6
            tests: test/features/profile
    env:
      AREA: ${{ matrix.area }}
      BRANCH: ${{ matrix.branch }}
      EXPECTED: ${{ matrix.expected }}
      TARGET_TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Select approved branch and verify exact source
        run: |
          cp scripts/prepare_hardening_validation.py "$RUNNER_TEMP/prepare_hardening_validation.py"
          if [ "$EXPECTED" = event ]; then EXPECTED="$GITHUB_SHA"; fi
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B hardening-work FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git fetch --depth=1 origin 72d7b56361b84123bc6d18f7e999fb494a65b339
          python3 "$RUNNER_TEMP/prepare_hardening_validation.py"
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and record focused validation
        run: |
          REPORT="docs/${AREA^^}_HARDENING_DIAGNOSTICS.txt"
          printf 'Source before preparation: %s\nArea: %s\n' "$(git rev-parse HEAD)" "$AREA" > "$REPORT"
          flutter --version >> "$REPORT"
          git add lib test docs
          git diff --name-only -z 72d7b56361b84123bc6d18f7e999fb494a65b339 -- '*.dart' | xargs -0 -r dart format >> "$REPORT" 2>&1
          set +e
          timeout 7m flutter test $TARGET_TESTS --reporter expanded >> "$REPORT" 2>&1
          TEST_EXIT=$?
          timeout 5m flutter analyze --fatal-infos >> "$REPORT" 2>&1
          ANALYZE_EXIT=$?
          NODE_EXIT=0
          if [ "$AREA" = web ]; then
            node --test functions/test/web_media_policy.test.js >> "$REPORT" 2>&1
            NODE_EXIT=$?
          fi
          printf '\nFocused test exit: %s\nAnalysis exit: %s\nNode test exit: %s\n' "$TEST_EXIT" "$ANALYZE_EXIT" "$NODE_EXIT" >> "$REPORT"
          printf 'TEST_EXIT=%s\nANALYZE_EXIT=%s\nNODE_EXIT=%s\n' "$TEST_EXIT" "$ANALYZE_EXIT" "$NODE_EXIT" >> "$GITHUB_ENV"
      - name: Save scoped changes and evidence without merging
        run: |
          if [ "$AREA" = web ]; then
            git rm .github/workflows/hardening-validation.yml scripts/prepare_hardening_validation.py
          fi
          git add lib test docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test($AREA): resolve observed failures and record focused recheck"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Require passing focused checks
        run: test "$TEST_EXIT" = 0 && test "$ANALYZE_EXIT" = 0 && test "$NODE_EXIT" = 0
