name: Backend Health Check

# Read-only liveness probe of the production backend: the Cloudflare Worker
# (all app data, D1 + R2) and Appwrite (sign-in only). Release Checklist calls
# it as a gate, so a failing probe blocks tagging.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-health:
    name: Worker & Appwrite auth health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://olitun-api.dulalkisku0.workers.dev' }}
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }}
    steps:
      - name: Worker /health
        run: |
          body=$(curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors "$API_BASE_URL/health")
          echo "$body"
          echo "$body" | jq -e '.status == "ok"' > /dev/null
      - name: Worker serves learner content from D1
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors \
            "$API_BASE_URL/api/v1/categories" | jq -e 'type == "array" or type == "object"' > /dev/null
      - name: Appwrite auth endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors \
            "$APPWRITE_ENDPOINT/health/version" | jq -e '.version' > /dev/null
