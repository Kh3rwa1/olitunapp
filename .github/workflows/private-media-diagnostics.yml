name: Private media diagnostics (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: private-media-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/authorized-media-streaming-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
      - name: Complete reviewed migration
        run: |
          if [ ! -f functions/test/authorized_media_access.test.js ]; then
            python3 tool/finalize_private_media.py
          fi
          npm ci --prefix functions/getAuthorizedLesson --ignore-scripts
          flutter pub get
          dart fix --apply --code=curly_braces_in_flow_control_structures,unnecessary_lambdas
          git diff --name-only origin/main...HEAD -- '*.dart' | xargs -r dart format
      - name: Validate transport and playback
        run: |
          set +e
          node --test functions/test/authorized_lesson.test.js functions/test/authorized_media_access.test.js functions/test/authorized_media_sdk_contract.test.js > /tmp/media-node.log 2>&1
          node_tests=$?
          flutter analyze --fatal-infos > /tmp/media-analyze.log 2>&1
          analyze=$?
          flutter test test/core/media --reporter expanded > /tmp/media-flutter.log 2>&1
          flutter_tests=$?
          printf 'Node exit: %s\nAnalyze exit: %s\nFlutter exit: %s\n' "$node_tests" "$analyze" "$flutter_tests" > /tmp/media-status.log
      - name: Save only to media review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add functions/getAuthorizedLesson/package.json functions/getAuthorizedLesson/package-lock.json functions/test/authorized_lesson.test.js functions/test/authorized_media_access.test.js lib/core/audio lib/core/media lib/features/lessons lib/shared/providers/learner_content_providers.dart lib/shared/utils/media_type_resolver.dart lib/shared/widgets/authorized_media_display.dart lib/shared/widgets/video_display.dart test/core/media
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(media): format validated playback and retry paths'
            gh auth setup-git
            git push origin HEAD:refs/heads/fix/authorized-media-streaming-20260906
          fi
      - name: Report evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '## Private media validation'
            echo
            echo "Head: $(git rev-parse HEAD)"
            echo '```text'
            cat /tmp/media-status.log
            tail -c 12000 /tmp/media-node.log
            tail -c 7000 /tmp/media-analyze.log
            tail -c 12000 /tmp/media-flutter.log
            echo
            echo '```'
          } > /tmp/media-report.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/media-report.md
