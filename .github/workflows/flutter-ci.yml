name: Flutter CI

on:
  push:
    branches: [ main, 'hardening/*', 'fix/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-analyze:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Enforce File Length Gate
        run: node scripts/check_file_length.mjs
      - name: Enforce Bundled Typography Gate
        run: node scripts/check_typography.mjs
      - name: Enforce Color Token Gate
        run: node scripts/check_color_literals.mjs
      - name: Enforce Localization Key Parity Gate
        run: node scripts/check_l10n_parity.mjs
      - name: Verify Version Consistency
        run: dart run tool/verify_version_consistency.dart
      - name: Audit Immutable GitHub Action SHA Pinning
        run: node scripts/verify_pinned_actions.mjs
      - name: Verify Signing Configuration Consistency
        run: node scripts/verify_signing_configuration.mjs
      - name: Verify Node Dependency Alignment
        run: node scripts/verify_node_dependency_alignment.mjs
      - name: Unit Test Android Certificate Normalizer
        run: node --test scripts/verify_android_signing_certificate.test.mjs
      - name: Analyze
        run: flutter analyze --fatal-infos

  flutter-unit-widget-tests:
    name: Flutter Unit, Widget & Coverage Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Flutter tests with coverage
        run: flutter test --coverage --concurrency=4
      - name: Enforce coverage threshold
        run: |
          dart run tool/enforce_coverage.dart \
            --min=70 \
            --path-min=/data/:40 \
            --path-min=/domain/:70 \
            --path-min=/core/auth/:50 \
            --enforce-after=2026-06-21 \
            --enforce-untested-after=2026-10-01 \
            --allow-invisible=_web.dart \
            --allow-invisible=_html.dart \
            --allow-invisible=/domain/repositories/ \
            --allow-invisible=lib/app/router/route_names.dart \
            --allow-invisible=lib/app/router/url_strategy.dart \
            --allow-invisible=lib/core/auth/web_redirect.dart \
            --allow-invisible=lib/core/motion/motion.dart \
            --allow-invisible=lib/shared/models/content_models.dart \
            --allow-invisible=lib/shared/models/content_item.dart \
            --allow-invisible=lib/shared/models/content/category_model.dart \
            --allow-invisible=lib/shared/providers/providers.dart \
            --allow-invisible=lib/shared/widgets/animated_buttons.dart \
            --allow-invisible=lib/shared/widgets/buttons/animated_buttons.dart \
            --allow-invisible=lib/shared/widgets/buttons/button_tokens.dart \
            --allow-invisible=lib/features/affirmations/domain/affirmation_share_service.dart \
            --allow-invisible=lib/features/practice/domain/practice_scoring_rules.dart \
            --allow-invisible=lib/features/admin/presentation/admin_login_screen.dart \
            --allow-invisible=lib/features/admin/presentation/admin_media_screen.dart \
            --allow-invisible=lib/features/admin/presentation/admin_settings_screen.dart \
            --allow-invisible=lib/features/admin/presentation/analytics/admin_analytics_csv_exporter.dart \
            --allow-invisible=lib/features/admin/presentation/quizzes/widgets/quiz_form_sheet.dart \
            --allow-invisible=lib/features/admin/presentation/widgets/admin_form_widgets.dart \
            --allow-invisible=lib/features/auth/presentation/email_auth_screen.dart \
            --allow-invisible=lib/features/categories/presentation/providers/category_providers.dart \
            --allow-invisible=lib/features/lessons/presentation/providers/lesson_providers.dart \
            --allow-invisible=lib/features/lessons/presentation/quiz/quiz_screen.dart \
            --allow-invisible=lib/features/lessons/presentation/widgets/lesson_content_widgets.dart \
            --allow-invisible=lib/features/main/presentation/main_shell_screen.dart \
            --allow-invisible=lib/features/profile/presentation/providers/profile_providers.dart
      - name: Smoke tests
        run: flutter test test/smoke
      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  node-backend-tests:
    name: Node Serverless Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/translator/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install translator dependencies
        run: npm ci --prefix functions/translator
      - name: Run root backend tests
        run: npm run test:backend
      - name: Run translator tests using translator package
        run: npm test --prefix functions/translator

  permission-and-schema-tests:
    name: Appwrite Permission Invariants & Schema Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Appwrite permission invariant unit tests
        run: flutter test test/core/api/appwrite_permission_invariants_test.dart
      - name: Run staging permission integration test (dry-run)
        run: node scripts/staging_permission_test.mjs
      - name: Run service worker patch unit tests
        run: node scripts/patch_service_worker.test.mjs
      - name: Detect Appwrite schema drift
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "⚠️ SKIPPED: APPWRITE_API_KEY secret is not configured in this environment."
            exit 0
          fi
          node scripts/snapshot_appwrite_schema.mjs
          if ! git diff --exit-code test/fixtures/schema/; then
            echo "❌ FAIL: Appwrite schema drift detected!"
            git --no-pager diff -- test/fixtures/schema/
            exit 1
          fi

  web-integration-tests:
    name: Web Application Integration Tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Launch Chromedriver and Run Web Journeys
        run: |
          if [ -n "$CHROMEWEBDRIVER" ] && [ -f "$CHROMEWEBDRIVER/chromedriver" ]; then
            $CHROMEWEBDRIVER/chromedriver --port=4444 &
          else
            CHROME_MAJOR=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
            npx --yes chromedriver@^$CHROME_MAJOR --port=4444 &
          fi
          sleep 3
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/all_tests.dart \
            -d web-server \
            --browser-name=chrome \
            --headless

  android-emulator-e2e:
    name: Android Emulator E2E Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALLOW_DEBUG_RELEASE_SIGNING: "true"
      ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Pre-warm adb server (avoids sporadic adb-connect boot flakes)
        run: adb start-server || true
      - name: Run Android E2E Tests on Headless Emulator
        id: e2e_attempt_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/all_tests.dart
      - name: Retry E2E once (emulator/adb infra flakes)
        if: steps.e2e_attempt_1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/all_tests.dart

  web-release-build:
    name: Web Release Build & Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Load performance budgets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -f tool/performance_budgets.json ]; then
            cp tool/performance_budgets.json /tmp/base_performance_budgets.json
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
          git show origin/"$BASE_REF":tool/performance_budgets.json > /tmp/base_performance_budgets.json 2>/dev/null || true
      - name: Build Web Release
        run: |
          BUILD_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release \
            --dart-define=APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }} \
            --dart-define=APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID || '699495910038e39622c5' }} \
            --dart-define=TRANSLATE_URL=${{ secrets.TRANSLATE_URL || 'https://sgp.cloud.appwrite.io/v1/functions/6a007db60024418c0997/executions' }} \
            --dart-define=BUILD_SHA=$BUILD_SHA \
            --dart-define=BUILT_AT=$BUILT_AT
          
          mkdir -p build/web
          echo "{\"sha\": \"$BUILD_SHA\", \"builtAt\": \"$BUILT_AT\"}" > build/web/build-info.json
          
          node scripts/patch_service_worker.mjs
          node scripts/verify_service_worker_patch.mjs
          (cd build/web && find . -type f -exec sha256sum {} + | sort > manifest.sha256)
      - name: Check Web performance budget
        run: dart run tool/check_size_budget.dart --path=build/web --budget-key=webBuildBytes --baseline=/tmp/base_performance_budgets.json --max-growth=5
      - name: Upload Web Release Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: web-release-build
          path: build/web/
          retention-days: 14

  android-release-build:
    name: Android Release Verification Build & Budget
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Load performance budgets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -f tool/performance_budgets.json ]; then
            cp tool/performance_budgets.json /tmp/base_performance_budgets.json
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
          git show origin/"$BASE_REF":tool/performance_budgets.json > /tmp/base_performance_budgets.json 2>/dev/null || true
      - name: Build Android Release Verification (Debug-Signed)
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }} \
            --dart-define=APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID || '699495910038e39622c5' }} \
            --dart-define=TRANSLATE_URL=${{ secrets.TRANSLATE_URL || 'https://sgp.cloud.appwrite.io/v1/functions/6a007db60024418c0997/executions' }}
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256)
      - name: Check APK performance budget
        run: dart run tool/check_size_budget.dart --path=build/app/outputs/flutter-apk/app-release.apk --budget-key=apkReleaseBytes --baseline=/tmp/base_performance_budgets.json --max-growth=10
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 14

  artifact-verification:
    name: Verify Release Artifact Integrity
    runs-on: ubuntu-latest
    needs: [flutter-unit-widget-tests, web-release-build, android-release-build]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download Coverage Artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4.1.8
        with:
          name: coverage-report
          path: coverage/
      - name: Download Web Build Artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4.1.8
        with:
          name: web-release-build
          path: artifacts/web/
      - name: Download Android APK Artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4.1.8
        with:
          name: android-release-apk
          path: artifacts/apk/
      - name: Verify Non-Empty & Provenance Checksums
        run: bash scripts/verify_release_artifacts.sh "${{ github.sha }}"

  dependency-freshness-gate:
    name: Dependency Freshness & Vulnerability Gate
    runs-on: ubuntu-latest
    # pub outdated + npm audit are both registry-bound; 10 min is too tight
    # when registries are slow (killed mid-audit repeatedly). The gate still
    # fails loudly on real findings — this only allows slow networks room.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2.18.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enforce Dependency Freshness & Scan Vulnerabilities
        run: node scripts/check_dependency_freshness.mjs

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [format-and-analyze, flutter-unit-widget-tests, node-backend-tests, permission-and-schema-tests, web-integration-tests, android-emulator-e2e, web-release-build, android-release-build, artifact-verification, dependency-freshness-gate]
    if: always()
    steps:
      - name: Check All Dependencies Succeeded
        run: |
          if [ "${{ needs.format-and-analyze.result }}" != "success" ] || \
             [ "${{ needs.flutter-unit-widget-tests.result }}" != "success" ] || \
             [ "${{ needs.node-backend-tests.result }}" != "success" ] || \
             [ "${{ needs.permission-and-schema-tests.result }}" != "success" ] || \
             [ "${{ needs.web-integration-tests.result }}" != "success" ] || \
             [ "${{ needs.android-emulator-e2e.result }}" != "success" ] || \
             [ "${{ needs.web-release-build.result }}" != "success" ] || \
             [ "${{ needs.android-release-build.result }}" != "success" ] || \
             [ "${{ needs.artifact-verification.result }}" != "success" ] || \
             [ "${{ needs.dependency-freshness-gate.result }}" != "success" ]; then
            echo "❌ Release Gate: One or more required CI jobs failed or were skipped!"
            exit 1
          fi
          echo "✅ Release Gate: All required CI jobs passed successfully!"
