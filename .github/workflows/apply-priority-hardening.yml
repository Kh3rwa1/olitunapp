name: Final priority hardening validation
on:
  push:
    branches: [fix/review-priority-hardening-20260905]
    paths: [.github/workflows/apply-priority-hardening.yml, scripts/finalize_priority_hardening.py]
concurrency:
  group: isolated-priority-hardening
  cancel-in-progress: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/review-priority-hardening-20260905
          fetch-depth: 30
      - name: Finalize source and release gates
        run: |
          git show b7ed8df6761e1c1028b7cae249c98f391b523a0d:scripts/apply_priority_hardening.py > /tmp/review_patch.py
          python3 scripts/finalize_priority_hardening.py > /tmp/finalize.log 2>&1
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get > /tmp/dependencies.log 2>&1
          npm ci >> /tmp/dependencies.log 2>&1
          npm ci --prefix functions/translator >> /tmp/dependencies.log 2>&1
      - name: Format and commit source only
        run: |
          python3 - <<'PY' >> /tmp/finalize.log 2>&1
          import json, subprocess
          paths=json.load(open('/tmp/final_changed_paths.json'))
          subprocess.run(['dart','format',*[p for p in paths if p.endswith('.dart')]],check=True)
          subprocess.run(['node','scripts/verify_function_deployment.mjs'],check=True)
          subprocess.run(['git','add','-A','--',*[p for p in paths if not p.startswith('.github/')]],check=True)
          subprocess.run(['git','config','user.name','Notion AI'],check=True)
          subprocess.run(['git','config','user.email','noreply@notion.so'],check=True)
          subprocess.run(['git','commit','-m','fix: validate scoped budgets and durable persistence regressions'],check=True)
          subprocess.run(['git','push','origin','HEAD:fix/review-priority-hardening-20260905'],check=True)
          PY
      - name: Static analysis
        run: |
          set +e
          flutter analyze --fatal-infos > /tmp/analyze.log 2>&1
          result=$?
          echo "Analysis exit: $result" >> /tmp/outcomes
          exit $result
      - name: Flutter regression tests
        if: success() || failure()
        run: |
          set +e
          flutter test test/core/ads test/core/payments test/shared/offline > /tmp/flutter.log 2>&1
          result=$?
          echo "Flutter regression exit: $result" >> /tmp/outcomes
          exit $result
      - name: Backend regression tests
        if: success() || failure()
        run: |
          set +e
          npm test > /tmp/backend.log 2>&1
          result=$?
          echo "Backend exit: $result" >> /tmp/outcomes
          exit $result
      - name: Persist verification results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          sections=['Source commit: '+subprocess.check_output(['git','rev-parse','HEAD'],text=True)]
          for name in ['finalize','outcomes','analyze','flutter','backend','dependencies']:
            p=Path('/tmp/'+name+('.log' if name!='outcomes' else ''))
            if p.exists():
              text=p.read_text()
              lines=text.splitlines()
              failures=[]
              for i,line in enumerate(lines):
                if 'not ok' in line or 'failed)' in line: failures.extend(lines[max(0,i-2):i+24])
              if len(text)>18000: text=text[:2000]+'\n...\n'+'\n'.join(failures)+'\n...\n'+text[-12000:]
              sections.append('\n## '+name+'\n'+text)
          Path('docs/PRIORITY_PATCH_DIAGNOSTICS.txt').write_text('\n'.join(sections))
          PY
          git add docs/PRIORITY_PATCH_DIAGNOSTICS.txt
          git config user.name 'Notion AI'
          git config user.email 'noreply@notion.so'
          git diff --cached --quiet || git commit -m 'chore: record priority verification results'
          git push origin HEAD:fix/review-priority-hardening-20260905
